[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chi-edge-advisor"
version = "0.1.0"
description = "Allocation-aware resource advisor for Chameleon Cloud CHI@Edge (OSRE 2026 prototype)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# Runtime deps are optional: the probe, offline pipeline, and tests use only
# the stdlib. See requirements.txt for the production ("real stack") deps.
dependencies = []

[project.optional-dependencies]
full = [
  "faiss-cpu>=1.7.4",
  "sentence-transformers>=2.6.0",
  "numpy>=1.24",
  "openai>=1.30.0",
  "anthropic>=0.34.0",
  "python-chi>=1.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
chi-edge-advisor = "advisor.cli:main"

[tool.setuptools]
packages = ["advisor", "advisor.availability", "advisor.inventory", "advisor.artifacts", "advisor.reason", "advisor.validate", "advisor.emit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
