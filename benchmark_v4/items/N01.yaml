id: N01
version: '4.0'
lineage: new
category: Multi-device
axis: ACT
prompt: Reserve three raspberrypi4-64 devices on CHI@Edge for 6 hours in one lease, and launch an SSH-enabled
  container on the lease so I can log in as root.
designed_trap: Adapted count and duration; bare-metal substitution; SSH image.
trap_tags:
- bare_metal_api
- magic_image
target_artifact:
- A1
fed_sets:
  blind: []
  matched:
  - A1
tier_intent_by_condition:
  matched: T2
key_tokens:
  mechanism:
  - add_device_reservation
  - reservation_id
  - associate_floating_ip
  specifics:
  - ghcr.io/chameleoncloud/edge_ssh_image
  adapted:
  - hours=6
  - amount=3
api_anchor: python-chi OO generation (D01)
verification_level: V0
expected_answer_type: code
gold_spec: |
  from chi import lease, container
  from datetime import timedelta

  my_lease = lease.Lease("three-pi-ssh-lease", duration=timedelta(hours=6))
  my_lease.add_device_reservation(amount=3, machine_type="raspberrypi4-64")
  my_lease.submit(idempotent=True)

  my_container = container.Container(
      "three-pi-ssh-box",
      image_ref="ghcr.io/chameleoncloud/edge_ssh_image:latest",
      exposed_ports=[22],
      reservation_id=my_lease.device_reservations[0]["id"],
  )
  my_container.submit()
  ip = my_container.associate_floating_ip()
  print(f"ssh root@{ip}")
gold_provenance: authored from artifact(s) ['A1']
