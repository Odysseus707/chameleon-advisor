summary: >-
  A CHI@Edge tutorial artifact demonstrating how to read from Raspberry Pi
  Sense HAT and Waveshare Sense HAT (B) peripherals by leasing a specific
  edge device, launching a prebuilt ARM container with an appropriate device
  profile, and executing sensor-reading scripts inside it. It uses the
  object-oriented python-chi API (lease.Lease / container.Container). Two
  parallel notebooks cover the two HAT variants, differing mainly in device
  name, device profile, and environment variables.

