preconditions:
  - Assumes running inside Chameleon's JupyterHub (chi.context.choose_project() interactive
    picker); the notebook provides commented openstack/token fallback for running elsewhere.
  - Assumes valid Chameleon credentials / app credentials are already sourced in the environment.
  - Assumes a USER environment variable is set (used to build the lease name).
  - Assumes the specific edge devices exist and are enrolled with the correct sense HAT
    physically attached (iot-rpi4-picam3 for RPi HAT, iot-rpi-cm4-02 for Waveshare HAT).
  - Assumes the device profiles "pi_sensehat" and "pi_gpio" already exist and expose the
    required /dev devices and boot options / device-tree overlays.
  - Assumes the prebuilt multi-arch (arm64) image ghcr.io/chameleoncloud/edge_sensehat_image:latest
    is published and pullable, and contains the /examples scripts.
  - Container stages assume an active lease with a device reservation whose id is read from
    container_lease.device_reservations[0]["id"].

traps_illustrated:
  - Device reservation (not node reservation) - uses add_device_reservation with machine_type
    and device_name rather than a physical-host/node reservation.
  - Container (not server/instance) - launches container.Container on CHI@Edge, not a bare-metal
    server; command is ["-c", "sleep infinity"] to keep the container alive.
  - reservation_id wiring - the container's reservation_id is pulled from
    container_lease.device_reservations[0]["id"] after the lease submits.
  - ARM image - the image is built for linux/arm64 (Raspberry Pi); Dockerfile/CI target arm64.
  - device_profile strings - correct profile string differs per HAT ("pi_sensehat" vs "pi_gpio"),
    exposing different /dev devices.
  - Kubernetes naming constraint - container_name uses .replace("_", "-") because CHI@Edge runs
    on Kubernetes and disallows underscores in names.
  - Environment-variable workarounds - Waveshare path sets RPI_LGPIO_REVISION / BLINKA_FORCECHIP /
    BLINKA_FORCEBOARD because /sys/firmware/devicetree/base is unavailable inside containers.
  - Executing code in a container via container.execute (both inline "python3 -c" and running
    prebuilt /examples scripts) rather than SSH into a server.

not_covered:
  - Does not use the imperative python-chi API (no chi.lease.create_lease / chi.container.* module
    functions); OO only.
  - Does not demonstrate blazar query/discovery of peripherals (explicitly noted as "soon"); device
    names are hardcoded.
  - Does not cover the RPi Sense HAT LED matrix (/dev/fb0) or joystick (/dev/input) beyond mention;
    no code drives them.
  - Does not read the RPi Sense HAT IMU (LSM9DS1: accelerometer/gyroscope/magnetometer) or color
    sensor (TCS3400) in code; only pressure/temperature/humidity via sense_hat.
  - No image/camera capture, no network services, no port exposure/binding, no volume mounts.
  - No file upload/download to the container (no upload/get_logs beyond execute stdout).
  - No lease waiting/status polling, no error handling/retries, no wait_for_active logic shown.
  - No SSH/floating IP/networking, no bare-metal server provisioning.
  - Does not build or push the Docker image at runtime (built separately via GitHub Actions CI).
  - Waveshare ADS1015 example does not pass the address kwarg despite markdown implying address=0x48.
  - Does not cover GPIO output/actuation (gpiod/libgpiod present in image but no example uses them).

