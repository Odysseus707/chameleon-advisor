# Chameleon bare-metal node capability table (chameleon wing)
#
# HAND-AUTHORED GROUND TRUTH, IN PART. This file is load-bearing for every
# reservation verdict and must be declared as such in any writeup.
#
# WHY IT EXISTS
# Blazar reports which hosts exist and whether they are free. It reports almost
# nothing about what they can DO: 18 of the 29 node types below have ZERO
# artifact coverage, so for those "correct" is defined by this file and by
# nothing else. That is the same situation the edge wing documents for five of
# its seven device types.
#
# PROVENANCE, PER FIELD. These are not the same kind of claim and must not be
# read as if they were:
#
#   MEASURED   node_count, sites
#              Read from Blazar in the 2026-09-04 capture. Blazar is
#              authoritative for what EXISTS and what is reservable.
#
#   CATALOG    ram_gb, vcpus, gpu_per_node, gpu_model, accelerator
#              Read from the Chameleon reference API
#              (https://api.chameleoncloud.org), the testbed's own hardware
#              catalog, on the date each row's capability_source names. It
#              answers for 100% of the nodes at both graded sites; Blazar
#              answered for 102 of 345 TACC hosts, which is why 17 of these
#              rows were null and why 12 items rejected hardware for lack of
#              data rather than lack of capability.
#
#              THE UNIT IS PHYSICAL CORES. vcpus = threads / 2 on x86_64 and
#              threads / 1 on aarch64 (the Ampere part in compute_arm64 has no
#              SMT). This conversion is the only assumption in the column.
#              Blazar's old `vcpus` was neither cores nor threads but whatever
#              Ironic recorded per node: compute_haswell_ib, gpu_k80, gpu_m40
#              and gpu_p100 are all 2x Xeon E5-2670 v3, and the table used to
#              say 24 for the first and 48 for the other three.
#
#              CONSERVATIVE WHERE A TYPE IS NOT ONE MACHINE. compute_gigaio is
#              6 Intel/256 GB nodes at CHI@TACC and 8 AMD/512 GB ones at
#              CHI@UC, and 10 of its 14 nodes carry a GPU. It reports the
#              weaker half - 256 GB, and gpu_per_node 0 - because reserving
#              the type can hand you any of its nodes, so the only honest
#              scalar is what the type GUARANTEES.
#
#   VENDOR     cuda_compute, cuda_cores, tensor_cores, vram_gb_per_gpu
#              Published NVIDIA/AMD/Intel specifications for the part named in
#              gpu_model, multiplied by gpu_per_node. Not measured, not from
#              any artifact. Because they scale with gpu_per_node, a wrong GPU
#              count silently corrupts capability_score too - gpu_h100 was
#              recorded with 2 GPUs and has 4.
#
#   capability_source, per row, names which of the two sources that row's
#   capability came from. A number from a live catalog and a number from a
#   hand-authored table must not sit in the same column unlabelled.
#
#   DERIVED    microarchitecture, architecture
#              Read off the node_type name, which states it (compute_skylake
#              is Skylake). accelerator is no longer derived from the name:
#              compute_liqid is named for its composable fabric and every one
#              of its 8 nodes carries an A100 that this table used to record
#              as no GPU at all.
#
#   CORPUS     covered_by - artifacts whose grounding names this type. Empty
#              for 18 of 29. Capability fields NEVER come from an artifact, so
#              a wrong artifact claim cannot leak into this table.
#
# accelerator does the most work in the solver:
#   none    CPU only.
#   cuda    NVIDIA. CUDA code runs.
#   rocm    AMD CDNA (gpu_mi100). ROCm only - CUDA code will NOT run on it.
#           This is the accelerator-confusion trap for this wing, and it is the
#           one an artifact-anchored system is most likely to get wrong,
#           because "GPU" reads as "CUDA" everywhere else in the corpus.
#   oneapi  Intel Data Center GPU Max (gpu_pontevecchio). Level Zero, not CUDA.
#   fpga    No general-purpose compute API at all.
#
# SITE MATTERS. The same type name can exist at one site and not the other:
# gpu_rtx_6000 is CHI@UC only, gpu_mi100 and gpu_p100 are CHI@TACC only. The
# per-type `sites` map records where each one actually is, and a reservation
# naming hardware absent from the chosen site is wrong in a way no amount of
# waiting fixes.
#
# compute_haswell IS NOT GONE. It appears here with 27 hosts at CHI@TACC from
# the 2026-09-04 capture and was reported ABSENT from live Blazar on
# 2026-09-05, which this file previously recorded as known drift. Re-probed on
# 2026-09-07: all 27 hosts are present and all 27 are reservable (none free -
# the whole type was busy). The 2026-09-05 reading was transient, and the
# absence of compute_haswell from the reference API is a gap in that catalog,
# not corroboration. One probe is an observation, not a decommissioning.
#
# Its ram_gb and vcpus are null and stay null: Blazar reports 0 for all 27 and
# the reference API does not list it, so BOTH sources are silent. Under R4 that
# is a missing measurement, not a small machine, and it fails every minimum on
# purpose. kvm_compute is the other row the catalog does not describe; it keeps
# its capture values for the same reason.
#
# THE SYNTHETIC SNAPSHOT VARIANTS ARE A FUNCTION OF THIS FILE.
# make_variants.py reads `accelerator` to decide which types a gpu_blackout
# blacks out. Changing an accelerator here and not regenerating them leaves a
# variant whose _meta still claims "every accelerator type unreservable" while
# one of them is free - which is how correcting compute_liqid turned two
# infeasible golds feasible for the wrong reason.

