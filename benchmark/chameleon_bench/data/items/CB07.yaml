api_anchor: python-chi OO generation (D01)
verification_level: V0
expected_answer_type: text
gold_spec: |
  There is no python-chi reservation code for this. Two separate things make it
  unavailable, and both matter.

  First, KVM@TACC does not require a lease or node reservation for its instances -
  reservations are the bare-metal path, not the KVM one - so there are no nodes to
  reserve here in the sense the question assumes.

  Second, an automated MLOps pipeline on Chameleon is provisioned declaratively:
  infrastructure lives in Terraform files with Ansible for configuration, and
  python-chi appears only to establish context - context.version, choose_project and
  choose_site. Writing an add_node_reservation or Server block here would be
  inventing a provisioning path that does not exist in this workflow.

  To see what the site actually offers:

  ```python
  import chi
  from chi import hardware

  chi.use_site("KVM@TACC")
  print([n.node_type for n in hardware.get_nodes()])
  ```
gold_provenance: 'Restated standalone (deictic repair). Grounded in A11 not_covered - ''No lease, node
  reservation or flavor reservation is made through python-chi anywhere'', ''No server creation through
  python-chi'', ''No bare-metal path; the tutorial targets the KVM cloud'' - and A11 traps_illustrated,
  ''Provisioning is declarative and lives in Terraform files, not in python-chi''. The KVM-requires-no-lease
  fact is A18 not_covered: ''No lease is created at all, since the KVM site does not require one for these
  instances.'''
