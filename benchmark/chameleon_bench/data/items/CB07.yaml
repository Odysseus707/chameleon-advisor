prompt: On KVM@TACC, show me the python-chi code that reserves the nodes and launches the servers for
  an automated MLOps training pipeline.
prompt_sha256: 751cd41b859a5b19fa6a0970822d1b4c132ede9e9c18be66465af368b8ae5136
designed_trap: There is no such code to show. The KVM site does not require a lease or node reservation
  at all, and the automated pipeline this describes provisions declaratively through Terraform and Ansible,
  with python-chi present only to establish context. The invented answer is a plausible Lease/Server block
  presented as the python-chi provisioning path for a workflow that has none.
