verification:
  basis: stub_execution
  probe_utc: '2026-09-07T12:09:17.430891+00:00'
exec_expect:
  site: CHI@UC
  node_reservations:
  - node_type: compute_cascadelake_r
    amount: 1
  lease_hours: 4
  lease_submitted: true
  server_image: CC-Ubuntu22.04
  server_bound_to_reservation: true
  fip_reservations: 1
expected_answer_type: code
gold_spec: |
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("CHI@UC")

  my_lease = lease.Lease("node-lease", duration=timedelta(hours=4))
  my_lease.add_node_reservation(amount=1, node_type="compute_cascadelake_r")
  my_lease.add_fip_reservation(amount=1)
  my_lease.submit(idempotent=True)

  my_server = server.Server(
      "node",
      image_name="CC-Ubuntu22.04",
      reservation_id=my_lease.node_reservations[0]["id"],
  )
  my_server.submit(idempotent=True, show="text")
gold_provenance: authored from A68. Grounds compute_cascadelake_r, add_node_reservation, node_reservations
  wiring and add_fip_reservation on one lease. Image is python-chi's documented default.
