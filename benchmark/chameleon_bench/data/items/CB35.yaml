exec_expect:
  site: CHI@TACC
  node_reservations:
  - node_type: gpu_p100
    amount: 1
  lease_hours: 2
  lease_submitted: true
  server_image: CC-Ubuntu20.04
  server_bound_to_reservation: true
  fip_reservations: 1
expected_answer_type: code
gold_spec: |
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("CHI@TACC")

  my_lease = lease.Lease("node-lease", duration=timedelta(hours=2))
  my_lease.add_node_reservation(amount=1, node_type="gpu_p100")
  my_lease.add_fip_reservation(amount=1)
  my_lease.submit(idempotent=True)

  my_server = server.Server(
      "node",
      image_name="CC-Ubuntu20.04",
      reservation_id=my_lease.node_reservations[0]["id"],
  )
  my_server.submit(idempotent=True, show="text")
gold_provenance: COMPOSED. A87 supplies the gpu_p100 literal; A74 supplies add_node_reservation, get_node_reservation,
  add_fip_reservation and CC-Ubuntu20.04, but its own GPU literal is gpu_rtx_6000 which exists only at
  CHI@UC.
