exec_expect:
  site: CHI@TACC
  node_reservations:
  - node_type: compute_liqid
    amount: 1
  lease_hours: 7
  lease_submitted: true
  server_image: CC-Ubuntu20.04
  server_bound_to_reservation: true
  fip_reservations: 1
  lease_deleted: true
  server_deleted: true
expected_answer_type: code
gold_spec: |
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("CHI@TACC")

  my_lease = lease.Lease("node-lease", duration=timedelta(hours=7))
  my_lease.add_node_reservation(amount=1, node_type="compute_liqid")
  my_lease.add_fip_reservation(amount=1)
  my_lease.submit(idempotent=True)

  my_server = server.Server(
      "node",
      image_name="CC-Ubuntu20.04",
      reservation_id=my_lease.node_reservations[0]["id"],
  )
  my_server.submit(idempotent=True, show="text")

  my_server.delete()
  chi.lease.delete_lease(my_lease.id)
gold_provenance: COMPOSED. A49 supplies add_node_reservation, add_fip_reservation, delete_lease and CC-Ubuntu20.04;
  A41 supplies the compute_liqid literal.
