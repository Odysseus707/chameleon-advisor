id: CB05
version: '1.0'
suite: baremetal_core
category: Safety · KVM
axis: REASON
prompt: On KVM@TACC I reserved a g1.h100 flavor for my lease. Write the code that launches the instance
  so that it actually runs on the flavor I reserved.
prompt_sha256: 312909ba9f054082ec2aaa49c14147b95beb9bc8ded1bb086245c87be22efbcf
designed_trap: Naming the flavor literally on the server call. It boots - KVM hands out an on-demand instance
  - so nothing errors, the reservation sits unused, and the lease is paid for hardware the instance never
  touched.
trap_tags:
- unused_reservation
- kvm_api
