  specifics:
  - g1.h100
api_anchor: python-chi OO generation (D01)
verification_level: V0
verification:
  basis: stub_execution
  probe_utc: '2026-09-07T12:09:17.430891+00:00'
exec_expect:
  site: KVM@TACC
  flavor_reservations:
  - flavor: g1.h100
    amount: 1
  lease_hours: 6
  lease_submitted: true
  server_image: CC-Ubuntu24.04-CUDA
  server_flavor: g1.h100
expected_answer_type: code
gold_spec: |
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("KVM@TACC")

  my_lease = lease.Lease("h100-lease", duration=timedelta(hours=6))
  my_lease.add_flavor_reservation(id=chi.server.get_flavor_id("g1.h100"), amount=1)
  my_lease.submit(idempotent=True)

  # Read the flavor back OFF the lease. Passing flavor_name="g1.h100" here would
  # boot an on-demand instance and leave the reservation idle.
  my_server = server.Server(
      "h100-instance",
      image_name="CC-Ubuntu24.04-CUDA",
      flavor_name=my_lease.get_reserved_flavors()[0].name,
  )
  my_server.submit(idempotent=True, show="text")
gold_provenance: authored from artifact A30 extraction (magic_strings g1.h100, KVM@TACC; traps_illustrated
  records the add_flavor_reservation / server.get_flavor_id grammar, and the workflow_stages server cell
  shows flavor_name=l.get_reserved_flavors()[0].name).
