  probe_utc: '2026-09-07T12:09:17.430891+00:00'
exec_expect:
  site: KVM@TACC
  flavor_reservations:
  - flavor: m1.large
    amount: 1
  lease_hours: 6
  lease_submitted: true
  server_image: CC-Ubuntu24.04
  server_flavor: m1.large
expected_answer_type: code
gold_spec: |
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("KVM@TACC")

  my_lease = lease.Lease("kvm-large-lease", duration=timedelta(hours=6))
  my_lease.add_flavor_reservation(id=chi.server.get_flavor_id("m1.large"), amount=1)
  my_lease.submit(idempotent=True)

  my_server = server.Server(
      "kvm-large",
      image_name="CC-Ubuntu24.04",
      flavor_name=my_lease.get_reserved_flavors()[0].name,
  )
  my_server.submit(idempotent=True, show="text")
gold_provenance: COMPOSED. A57 supplies the get_reserved_flavors read-back idiom and the CC-Ubuntu24.04
  image but never names m1.large; A84 supplies the m1.large literal but not the read-back. Verified by
  token presence.
