  fip_reservations: 1
expected_answer_type: code
gold_spec: |
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("CHI@TACC")

  my_lease = lease.Lease("node-lease", duration=timedelta(hours=4))
  my_lease.add_node_reservation(amount=1, node_type="gpu_mi100")
  my_lease.add_fip_reservation(amount=1)
  my_lease.submit(idempotent=True)

  my_server = server.Server(
      "node",
      image_name="CC-Ubuntu22.04",
      reservation_id=my_lease.node_reservations[0]["id"],
  )
  my_server.submit(idempotent=True, show="text")
gold_provenance: COMPOSED. A53 supplies add_node_reservation, get_node_reservation, add_fip_reservation
  and CC-Ubuntu22.04; A90 supplies the gpu_mi100 literal. A53 never names gpu_mi100 and A90 has no reservation
  grammar.
