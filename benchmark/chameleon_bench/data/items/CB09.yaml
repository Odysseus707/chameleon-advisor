gold_spec: |
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("CHI@TACC")

  my_lease = lease.Lease("mi100-lease", duration=timedelta(hours=3))
  my_lease.add_node_reservation(amount=1, node_type="gpu_mi100")
  my_lease.submit(idempotent=True)

  my_server = server.Server(
      "mi100-node",
      image_name="CC-Ubuntu22.04",
      reservation_id=my_lease.node_reservations[0]["id"],
  )
  my_server.submit(idempotent=True, show="text")

  # Teardown. The lease outlives the instance unless it is deleted explicitly.
  my_server.delete()
  chi.lease.delete_lease(my_lease.id)
gold_provenance: 'COMPOSED from two artifacts, neither sufficient alone. A9 supplies the lifecycle grammar:
  add_node_reservation, get_node_reservation / reservation_id wiring, create_server, and the delete_lease
  teardown stage - but names no node type, site or image. A15 supplies the hardware literals gpu_mi100
  and CHI@TACC - but shows no server launch and no teardown. Verified by token presence in each grounding
  document; see the fed_sets partial condition, which drops A15 and leaves the answer unreachable.'
