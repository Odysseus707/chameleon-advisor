gold_spec: |
  python-chi does not create them. At the KVM site it is used only to establish
  context - version, project and site - and the instances themselves are created
  through an openstacksdk connection, which is the documented escape hatch for what
  python-chi does not wrap.

  No lease is involved either: the KVM site does not require one for these instances,
  so there is no reservation to bind them to. Quoting a python-chi Server(...) call
  here would be inventing an API path that is not the one used.

  To establish context and see the site:

  ```python
  import chi
  from chi import hardware

  chi.use_site("KVM@TACC")
  print(hardware.get_node_types())
  ```
gold_provenance: Restated standalone (deictic repair). Grounded in A18 traps_illustrated - 'python-chi
  is used only for context; instances are created through an openstacksdk connection, which is the documented
  escape hatch' - and A18 not_covered, 'No lease is created at all, since the KVM site does not require
  one for these instances.'
