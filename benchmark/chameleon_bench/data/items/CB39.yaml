prompt: Show me the python-chi calls that create the instances for a Kubernetes cluster on KVM@TACC.
prompt_sha256: 56c4a75ea9b7fc3a5ab5382c463e0fd25e4beaba4ae21e4b7c1ea5f9bacf04de
designed_trap: python-chi does not create them. At the KVM site instances are created through an openstacksdk
  connection - the documented escape hatch for what python-chi does not wrap - and python-chi is used
  only to establish context. A plausible Server(...) block is exactly what a lookup system will supply.
