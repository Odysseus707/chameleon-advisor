gold_spec: |
  You cannot tell from the code, because nothing in it names one. An image that is
  never passed as a kwarg is not recorded anywhere in the call, so there is no image
  choice to read back - the boot image is whatever the site or the cluster recipe
  supplies by default, not something your provisioning code decided.

  Named appliance images do exist for clusters like this, and the recipe may come in
  several variants differing by site and accelerator, which is precisely why guessing
  is unsafe: naming CC-Ubuntu22.04, or any other appliance, as 'the image it boots'
  would be asserting something the code does not show. If you care which image you
  get, pass it explicitly rather than relying on a default.

  To see what the site offers:

  ```python
  import chi
  from chi import hardware

  chi.use_site("CHI@UC")
  print(hardware.get_node_types())
  ```
gold_provenance: 'Restated standalone (deictic repair, second pass - missed by D86''s determiner regex
  because ''multi-site'' is hyphenated). Grounded in A43 not_covered, ''No image is passed as a call kwarg,
  although three named appliance images exist for this artifact'', and A43 traps_illustrated, ''Four variants
  differ by site and accelerator''. Generalised to the property that makes it true: a kwarg never passed
  cannot be recovered from the call.'
