gold_spec: |
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("CHI@UC")

  my_lease = lease.Lease("skylake-fip-lease", duration=timedelta(hours=5))
  my_lease.add_node_reservation(amount=1, node_type="compute_skylake")
  my_lease.add_fip_reservation(amount=1)
  my_lease.submit(idempotent=True)

  my_server = server.Server(
      "skylake-node",
      image_name="CC-Ubuntu22.04",
      reservation_id=my_lease.node_reservations[0]["id"],
  )
  my_server.submit(idempotent=True, show="text")

  # The floating IP THIS lease reserved. associate_floating_ip() with no
  # argument calls get_free_floating_ip(), which returns the first unallocated
  # floating IP in the PROJECT - not the one reserved here - so in a shared
  # project it can bind an address another lease is holding, and fails as
  # "None of the ports can route to floating ip ...", which names neither cause.
  reserved_fip = my_lease.get_reserved_floating_ips()[0]
  fip = my_server.associate_floating_ip(reserved_fip)
  print(fip)
gold_provenance: 'COMPOSED, and the composition is forced by a real defect in the corpus. A25 grounds
  compute_skylake, CC-Ubuntu22.04 and add_fip_reservation, but the only reservation-wiring idiom it shows
  is lease.get_node_reservation - verified BROKEN in python-chi 1.2.10 on 2026-09-05 against CHI@TACC
  (project CHI-231225): it raises AttributeError because _reservation_matching expects a lease dict while
  get_lease returns a Lease object. A54 supplies the working node_reservations[0][''id''] form. An answer
  built from A25 alone would be faithful to its source and would not run - which is exactly what this
  item measures.'
