gold_spec: |
  There is no reservation step to write. KVM@TACC does not require a lease or node
  reservation for its instances - leases are the bare-metal path - so nothing needs
  reserving before you launch.

  Provisioning at the KVM site is done through the Horizon web interface and the
  command line, or through openstacksdk; python-chi is used there only to establish
  context, with choose_site defaulting to the KVM cloud. Quoting an
  add_node_reservation or Lease block here would be inventing a grammar this site
  does not use.

  If you want to see what the testbed exposes:

  ```python
  import chi
  from chi import hardware

  chi.use_site("KVM@TACC")
  print(hardware.get_node_types())
  ```
gold_provenance: Restated standalone (deictic repair). Grounded in A13 not_covered - 'No lease or reservation
  of any kind through python-chi', 'No bare-metal provisioning; this is a virtual-machine tutorial' -
  and A13 traps_illustrated, 'the tutorial teaches Horizon and the CLI, so no reservation grammar exists
  in Python to find'. The KVM-requires-no-lease fact is A18 not_covered.
