gold_spec: |
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("CHI@UC")

  my_lease = lease.Lease("node-lease", duration=timedelta(hours=8))
  my_lease.add_node_reservation(amount=1, node_type="gpu_rtx_6000")
  my_lease.add_fip_reservation(amount=1)
  my_lease.submit(idempotent=True)

  my_server = server.Server(
      "node",
      image_name="CC-Ubuntu22.04",
      reservation_id=my_lease.node_reservations[0]["id"],
  )
  my_server.submit(idempotent=True, show="text")

  # The floating IP THIS lease reserved. associate_floating_ip() with no
  # argument calls get_free_floating_ip(), which returns the first unallocated
  # floating IP in the PROJECT - not the one reserved here - so in a shared
  # project it can bind an address another lease is holding, and fails as
  # "None of the ports can route to floating ip ...", which names neither cause.
  reserved_fip = my_lease.get_reserved_floating_ips()[0]
  fip = my_server.associate_floating_ip(reserved_fip)
  print(fip)

  my_server.delete()
  chi.lease.delete_lease(my_lease.id)
gold_provenance: COMPOSED. A92 supplies add_fip_reservation and the reservation wiring; A76 supplies the
  gpu_rtx_6000 literal and the delete_lease teardown.
