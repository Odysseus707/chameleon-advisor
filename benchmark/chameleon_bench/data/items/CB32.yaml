    amount: 1
  lease_hours: 5
  lease_submitted: true
  server_image: CC-Ubuntu24.04
  server_bound_to_reservation: true
expected_answer_type: code
gold_spec: |
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("CHI@TACC")

  my_lease = lease.Lease("node-lease", duration=timedelta(hours=5))
  my_lease.add_node_reservation(amount=1, node_type="gpu_p100")
  my_lease.submit(idempotent=True)

  my_server = server.Server(
      "node",
      image_name="CC-Ubuntu24.04",
      reservation_id=my_lease.node_reservations[0]["id"],
  )
  my_server.submit(idempotent=True, show="text")
gold_provenance: COMPOSED. A52 supplies the gpu_p100 literal and CC-Ubuntu24.04 but makes no bare-metal
  node reservation at all; A95 supplies add_node_reservation and get_node_reservation but names neither
