prompt: On CHI@TACC, reserve a compute_cascadelake node and boot CC-Ubuntu22.04 on it. Make sure the instance
  is actually bound to the reservation.
prompt_sha256: b6de37e6e8f56ce09eb02ec7f53b1a760f7ac43de7eb86a4b22f56909bccb24f
designed_trap: Passing the LEASE id where a RESERVATION id is required. The two are different identifiers,
  the call accepts either shape, and the failure surfaces only when the instance never boots.
