api_anchor: python-chi OO generation (D01)
verification_level: V2
verification:
  basis: live_execution
  probe_utc: '2026-09-07T12:09:17.430891+00:00'
  python_chi: 1.2.10
  evidence: live_gold_v2_evidence_2026-09-07.md
exec_expect:
  site: CHI@TACC
  node_reservations:
  - node_type: compute_cascadelake
    amount: 1
  lease_hours: 3
  lease_submitted: true
  server_image: CC-Ubuntu22.04
  server_bound_to_reservation: true
expected_answer_type: code
gold_spec: |
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("CHI@TACC")

  my_lease = lease.Lease("cascadelake-lease", duration=timedelta(hours=3))
  my_lease.add_node_reservation(amount=1, node_type="compute_cascadelake")
  my_lease.submit(idempotent=True)

  # The RESERVATION id, not the lease id. Server accepts either shape and only
  # the reservation id actually binds the instance to the reserved hardware.
  my_server = server.Server(
      "cascadelake-node",
      image_name="CC-Ubuntu22.04",
      reservation_id=my_lease.node_reservations[0]["id"],
  )
  my_server.submit(idempotent=True, show="text")
gold_provenance: 'authored from artifact A55 extraction. traps_illustrated records ''reservation_id is
  threaded from my_lease.node_reservations[0]["id"] into Server, not from the raw lease id'' - exactly
  the trap this item tests. magic_strings gives CC-Ubuntu22.04 and CHI@TACC; compute_cascadelake is in
  node_types_observed and present in the grounding document. RETARGETED from A21: A21''s registry lists
  compute_cascadelake_r only because rank.py merges signals across all linked repos, and that literal
  is absent from the grounding the model is actually fed - the item would have demanded a specific it
  never supplied.'
