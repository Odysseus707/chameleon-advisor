verification_level: V0
expected_answer_type: text
gold_spec: |
  It does not launch one. A lease only holds the hardware for you; it never boots
  anything, so there is no server-launch step inside the reservation to show.

  Reserving and launching are two separate, explicit actions. The lease reserves a
  gpu_rtx_6000 node and ends there; if you want something running on that node you
  create the server yourself afterwards and bind it to the reservation. Presenting a
  Server(...) call as though the lease performed it would be inventing the step that
  does not exist.

  To confirm what the lease is actually holding:

  ```python
  import chi
  from chi import hardware

  chi.use_site("CHI@UC")
  print([n.node_type for n in hardware.get_nodes(node_type="gpu_rtx_6000")])
  ```
gold_provenance: 'Restated standalone (deictic repair). Grounded in A12: its workflow is site/auth followed
  by three lease stages with no server stage at all. The general fact - a reservation holds hardware and
  does not boot it - is the same separation every bare-metal composition item in this suite relies on.'
