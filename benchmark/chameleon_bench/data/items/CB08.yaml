prompt: At CHI@UC, show me how a gpu_rtx_6000 lease launches a server onto the node it reserved.
prompt_sha256: 776899388b3045049af04486235836db400ae17bbc8c7994fc14d5a4409530d9
designed_trap: A lease launches nothing. Reserving hardware and booting on it are two separate explicit
  steps, so there is no 'the lease launches the server' code to quote. The invented answer is a fabricated
  Server(...) call presented as part of the reservation.
