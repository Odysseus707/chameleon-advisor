expected_answer_type: code
gold_spec: |
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("CHI@UC")

  my_lease = lease.Lease("skylake-week", duration=timedelta(hours=168))
  my_lease.add_node_reservation(amount=1, node_type="compute_skylake")
  my_lease.submit(idempotent=True)

  my_server = server.Server(
      "skylake-node",
      image_name="CC-Ubuntu22.04",
      reservation_id=my_lease.node_reservations[0]["id"],
  )
  my_server.submit(idempotent=True, show="text")
