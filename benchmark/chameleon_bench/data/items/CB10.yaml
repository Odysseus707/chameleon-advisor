exec_expect:
  site: CHI@UC
  node_reservations:
  - node_type: compute_cascadelake_r
    amount: 1
  lease_hours: 3
  lease_submitted: true
  server_image: CC-Ubuntu22.04
  server_bound_to_reservation: true
  lease_deleted: true
  server_deleted: true
expected_answer_type: code
gold_spec: |
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("CHI@UC")

  my_lease = lease.Lease("node-lease", duration=timedelta(hours=3))
  my_lease.add_node_reservation(amount=1, node_type="compute_cascadelake_r")
  my_lease.submit(idempotent=True)

  my_server = server.Server(
      "node",
      image_name="CC-Ubuntu22.04",
      reservation_id=my_lease.node_reservations[0]["id"],
  )
  my_server.submit(idempotent=True, show="text")

  # Teardown. The lease outlives the instance unless it is deleted explicitly.
  my_server.delete()
  chi.lease.delete_lease(my_lease.id)
gold_provenance: COMPOSED. A21 supplies the reservation_id wiring via node_reservations and the CC-Ubuntu22.04
  image; it names no node type and never tears down. A78 supplies the compute_cascadelake_r literal and
  the delete_lease teardown; it names no image. Token presence verified in each grounding document.
