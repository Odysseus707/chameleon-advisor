gold_spec: |
  You cannot. openstacksdk has no bare-metal reservation API - it talks to the
  OpenStack services directly and there is no lease or node-reservation grammar in it
  to call.

  Bare-metal reservation on Chameleon is Blazar's job, reached through python-chi's
  lease module (or the blazar client underneath it). Those are different systems, so
  there is nothing in openstacksdk to adapt and writing an openstacksdk reservation
  call would be inventing one.

  To see what is actually reservable at a site:

  ```python
  import chi
  from chi import hardware

  chi.use_site("CHI@TACC")
  print(hardware.get_node_types())
  ```
gold_provenance: Restated standalone (deictic repair). Grounded in A16 not_covered - 'No lease, node reservation
  or flavor reservation of any kind', 'No server or instance creation' - and A16 traps_illustrated, 'All
  cloud interaction goes through openstacksdk connections rather than python-chi'. The item now asserts
  the general separation (openstacksdk has no Blazar path) rather than a property of one artifact.
