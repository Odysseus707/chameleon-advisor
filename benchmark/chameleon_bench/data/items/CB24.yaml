designed_trap: openstacksdk cannot reserve bare-metal hardware. Reservations are Blazar's, reached through
  python-chi's lease module or the blazar client; openstacksdk speaks to the OpenStack services and has
  no lease grammar at all. The invented answer is a plausible openstacksdk reservation call that does
  not exist.
