id: CB25
version: '1.0'
suite: baremetal_core
category: Abstention
axis: REASON
prompt: I'm using lease.get_lease() at CHI@UC. Show me how it creates the lease for my hardware.
prompt_sha256: ff21ec4f64613fa95147b4ec75b1d48433ccc47cd8a6dc0de2965c8b79d4e24e
designed_trap: get_lease creates nothing. It looks up a lease that already exists, so asking for the creation
  it performs invites a fabricated add_node_reservation block attributed to a call that only reads.
trap_tags:
- absent_capability
- confident_invention
target_artifact:
- A8
target_content_group: 4fbfddfa034a
fed_sets:
  blind: []
  matched:
  - A8
  heldout:
  - A16
  - A47
tier_intent_by_condition:
  matched: T4
  heldout: T4
key_tokens:
  mechanism:
  - get_node_types
  specifics:
  - provisioning
api_anchor: python-chi OO generation (D01)
verification_level: V0
expected_answer_type: text
gold_spec: |
  It does not create one. lease.get_lease looks up a lease that already exists and
  attaches to it - it is a read, not a provisioning call - so there is no creation
  code inside it to show.

  If the lease you are naming has not been made yet, get_lease will not make it for
  you; it fails to find it. Creating a reservation is a different, explicit step: you
  build a lease with a node reservation on it and submit that. Attributing an
  add_node_reservation block to get_lease would be inventing behaviour the call does
  not have.

  To see what could be reserved at the site:

  ```python
  import chi
  from chi import hardware

  chi.use_site("CHI@UC")
  print(hardware.get_node_types())
  ```
gold_provenance: Restated standalone (deictic repair). Grounded in A8 traps_illustrated - 'lease.get_lease
  attaches to an existing reservation rather than creating one, so nothing here demonstrates how the hardware
  was obtained' - and A8 not_covered, 'No lease creation, node reservation or flavor reservation anywhere'.
  The semantics of get_lease are a property of the API, so the restated question is answerable blind.
