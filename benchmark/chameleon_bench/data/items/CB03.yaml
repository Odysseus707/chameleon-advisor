exec_expect:
  site: KVM@TACC
  flavor_reservations:
  - flavor: m1.xlarge
    amount: 1
  lease_hours: 8
  lease_submitted: true
  server_image: CC-Ubuntu24.04
  server_flavor: m1.xlarge
expected_answer_type: code
gold_spec: |
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("KVM@TACC")

  my_lease = lease.Lease("kvm-xlarge-8h", duration=timedelta(hours=8))
  my_lease.add_flavor_reservation(id=chi.server.get_flavor_id("m1.xlarge"), amount=1)
  my_lease.submit(idempotent=True)

  my_server = server.Server(
      "kvm-xlarge",
      image_name="CC-Ubuntu24.04",
      flavor_name=my_lease.get_reserved_flavors()[0].name,
  )
  my_server.submit(idempotent=True, show="text")
gold_provenance: authored from artifact A17 extraction (magic_strings KVM@TACC, m1.xlarge; traps_illustrated
  records the add_flavor_reservation / get_flavor_id grammar and submit(idempotent=True)). Server launch
  shape from the same wing's A30/A57/A94, which show get_reserved_flavors()[0].name.
