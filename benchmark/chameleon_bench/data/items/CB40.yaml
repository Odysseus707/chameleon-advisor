prompt: At CHI@UC I attach to my hardware with lease.get_lease(name). Which bare-metal node type does
  that call reserve?
prompt_sha256: edb6d5ba3faf6eec63a2c99943fdf0214479f2553d88ff76fd9b150ea4046133
designed_trap: It reserves none. get_lease attaches to a lease that already exists and makes no reservation
  of its own, so the node type was fixed by whoever created that lease and is not visible from the call.
  Naming a type is invention.
