gold_spec: |
  None - that call reserves nothing. lease.get_lease attaches to a lease that already
  exists; it makes no reservation of its own, so there is no node type for it to ask
  for.

  Whatever hardware you end up on was decided by whoever created that lease, not by
  this call, and the call does not tell you which type that was. Naming a node type
  here would be inventing a choice get_lease never makes. Note also that if the name
  you pass does not match a real lease, the lookup simply fails - it does not create
  one.

  To see what the site offers, or to pin a type on a lease you create yourself:

  ```python
  import chi
  from chi import hardware

  chi.use_site("CHI@UC")
  print(hardware.get_node_types())
  ```
gold_provenance: Restated standalone (deictic repair). Grounded in A59 traps_illustrated - 'lease.get_lease
  attaches to an existing reservation rather than creating one' and 'The lease name is a literal placeholder,
  so an unedited run fails on a lease that does not exist' - and A59 not_covered, 'No image or node type
  is passed to any call, so no hardware choice is demonstrated in code.'
