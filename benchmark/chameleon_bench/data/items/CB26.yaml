api_anchor: python-chi OO generation (D01)
verification_level: V0
expected_answer_type: text
gold_spec: |
  No particular one, and you should not assume a type. A reservation that names no
  node_type is not pinned to any hardware: Blazar satisfies it with whatever free node
  matches the constraints you did give, so which type you land on is not determined by
  your request and can differ between runs.

  If you need a specific type you have to ask for it explicitly. Naming
  compute_cascadelake_r, or any other type, as the one you would get here would be
  inventing a guarantee the reservation does not make.

  To list what the site actually offers, then pin one deliberately:

  ```python
  import chi
  from chi import hardware

  chi.use_site("CHI@TACC")
  print(hardware.get_node_types())
  ```
gold_provenance: 'Restated standalone (deictic repair). Grounded in A10 not_covered - ''No explicit node_type
  is pinned anywhere; the artifact does not demonstrate reserving a named bare-metal node type'' - generalised
  to the property that makes it true: an unconstrained Blazar reservation is matched, not pinned. The
  previous specifics anchor (CC-Ubuntu22.04) described the artifact''s image and no longer applies.'
