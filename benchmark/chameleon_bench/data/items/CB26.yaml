suite: baremetal_core
category: Abstention
axis: REASON
prompt: If I reserve a bare-metal node at CHI@TACC without naming a node_type, which node type does the
  reservation give me?
prompt_sha256: f24c613a1a5942593acfa068c4fd5cff326037c2f05790f73957c0b2620e91f9
designed_trap: No particular one. An unconstrained reservation is satisfied by whatever matching node
  Blazar allocates, so naming a specific type in the answer is invention - and a node type is exactly
  what a lookup system will confidently supply.
trap_tags:
- absent_capability
- confident_invention
