exec_expect:
  site: KVM@TACC
  flavor_reservations:
  - flavor: m1.medium
    amount: 1
  lease_hours: 3
  lease_submitted: true
  server_image: CC-Ubuntu24.04
  server_flavor: m1.medium
expected_answer_type: code
gold_spec: |
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("KVM@TACC")

  my_lease = lease.Lease("kvm-med-lease", duration=timedelta(hours=3))
  my_lease.add_flavor_reservation(id=chi.server.get_flavor_id("m1.medium"), amount=1)
  my_lease.submit(idempotent=True)

  my_server = server.Server(
      "kvm-med",
      image_name="CC-Ubuntu24.04",
      flavor_name=my_lease.get_reserved_flavors()[0].name,
  )
  my_server.submit(idempotent=True, show="text")
gold_provenance: authored from A50. Grounds add_flavor_reservation, get_flavor_id, m1.medium and CC-Ubuntu24.04.
  The get_reserved_flavors read-back is the wing's established KVM idiom (A30, A57, A94).
