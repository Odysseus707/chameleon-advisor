  lease_deleted: true
  server_deleted: true
expected_answer_type: code
gold_spec: |
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("CHI@UC")

  my_lease = lease.Lease("node-lease", duration=timedelta(hours=6))
  my_lease.add_node_reservation(amount=1, node_type="compute_skylake")
  my_lease.submit(idempotent=True)

  my_server = server.Server(
      "node",
      image_name="CC-Ubuntu20.04",
      reservation_id=my_lease.node_reservations[0]["id"],
  )
  my_server.submit(idempotent=True, show="text")

  # Teardown. The lease outlives the instance unless it is deleted explicitly.
  my_server.delete()
  chi.lease.delete_lease(my_lease.id)
gold_provenance: COMPOSED. A23 supplies the compute_skylake and CC-Ubuntu20.04 literals; A19 supplies
  the delete_lease teardown. A23 never tears down and A19 names no image.
