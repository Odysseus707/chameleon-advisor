exec_expect:
  site: CHI@TACC
  node_reservations:
  - node_type: compute_cascadelake_r
    amount: 1
  lease_hours: 3
  lease_submitted: true
  server_image: CC-Ubuntu22.04
  server_bound_to_reservation: true
expected_answer_type: code
gold_spec: |
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("CHI@TACC")

  my_lease = lease.Lease("node-lease", duration=timedelta(hours=3))
  my_lease.add_node_reservation(amount=1, node_type="compute_cascadelake_r")
  my_lease.submit(idempotent=True)

  my_server = server.Server(
      "node",
      image_name="CC-Ubuntu22.04",
      reservation_id=my_lease.node_reservations[0]["id"],
  )
  my_server.submit(idempotent=True, show="text")
gold_provenance: authored from A35. traps_illustrated records 'Two different site-selection idioms appear
  in one notebook - a direct use_site call and an interactive choose_site with a different default'. magic_strings
  gives CC-Ubuntu22.04, CHI@TACC and CHI@UC; compute_cascadelake_r is the node type A35's registry records
  and it exists at CHI@TACC in the 2026-09-04 capture.
