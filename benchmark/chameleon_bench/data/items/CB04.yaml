exec_expect:
  site: KVM@TACC
  flavor_reservations:
  - flavor: g1.h100
    amount: 1
  lease_hours: 4
  lease_submitted: true
  server_image: CC-Ubuntu24.04-CUDA
  server_flavor: g1.h100
expected_answer_type: code
gold_spec: |
  import os
  from datetime import timedelta

  import chi
  from chi import lease, server

  chi.use_site("KVM@TACC")

  my_lease = lease.Lease(f"{os.getenv('USER')}-gpu-lease", duration=timedelta(hours=4))
  my_lease.add_flavor_reservation(id=chi.server.get_flavor_id("g1.h100"), amount=1)
  my_lease.submit(idempotent=True)

  reserved_flavor = my_lease.get_reserved_flavors().pop()

  my_server = server.Server(
      f"{os.getenv('USER')}-gpu-instance",
      flavor_name=reserved_flavor.name,
      image_name="CC-Ubuntu24.04-CUDA",
  )
  my_server.submit(idempotent=True, show="text")
gold_provenance: authored from artifact A94 extraction (magic_strings CC-Ubuntu24.04-CUDA, KVM@TACC; traps_illustrated
  records reserving the flavor then reading it back with get_reserved_flavors().pop(), and pinning the
  site with use_site rather than choose_site). The g1.h100 flavor literal is grounded in A30's magic_strings.
