uncertainties:
- The registry lists three node types for this artifact; the extracted cells bind only one to NODE_TYPE.
  The others come from the ranking pass reading the whole repository rather than these cells.
- lease_hours_declared includes a zero, which is the days argument of lease.lease_duration being read
  as an hours declaration.
- The extraction captures the ONNX Runtime profiling notebook; the repository states it holds notebooks
  for two tasks, so the second is outside the extracted surface.
