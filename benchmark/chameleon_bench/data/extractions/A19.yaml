api_generation: imperative
summary: A reproducible-research repository measuring whether post-training dynamic range quantization
  actually speeds up inference, across several models, frameworks and hardware targets on Chameleon. Provisioning
  uses the legacy imperative python-chi surface throughout (chi.use_site, lease.add_node_reservation,
  lease.create_lease, server.create_server) rather than the current context and Lease objects. Reserves
  one CPU node plus a floating IP at CHI@UC for an eight-hour lease, then launches a server against the
  node reservation. The node type is bound to a module-level constant that later cells reuse for the lease
  and server names, so changing hardware means editing one line and re-running two separate setup cells.
