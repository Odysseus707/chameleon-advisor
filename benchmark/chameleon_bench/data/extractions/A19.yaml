preconditions:
- Assumes the OS_PROJECT_NAME environment variable is set, since the second setup cell reads it and passes
  it to chi.set.
- Assumes a username variable is already defined; the lease and server names interpolate it and the extraction
  does not show where it comes from.
- Assumes an image name is configured in the chi settings, because create_server reads it from chi.get
  rather than naming one.
- Assumes the requested CPU node type is free at CHI@UC, because the lease is created for an immediate
  eight-hour window and then waited on.
traps_illustrated:
- The notebook is split into two independently runnable halves and warns that a change in the first must
  be repeated in the second, which is a real source of divergent runs.
- wait_for_active is called on the lease immediately, with a comment noting it must be commented out for
  a future-dated lease.
- reservation_id comes from lease.get_node_reservation on the lease id, not from the lease id itself.
- Deletion is guarded by a DELETE flag defaulting to false, so the teardown cell is present but inert
  unless edited.
- 'Legacy-era API: an explicit start_date and end_date pair from lease.lease_duration rather than a duration
  on a Lease object.'
not_covered:
- No GPU path, despite the study comparing hardware; the extracted provisioning reserves CPU nodes only.
- No image build or registration; the image is whatever chi.get returns.
- No KVM or container path.
- No floating IP association step, despite the IP being reserved.
memorization_probes:
- NODE_TYPE = "compute_cascadelake_r"
