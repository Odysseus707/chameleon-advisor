summary: A reproducibility study of two speech translation and recognition papers, SeamlessM4T and the
  large-scale weak-supervision work behind Whisper, carried out as a formal reproducibility project at
  NYU Tandon. Provisions a GPU node at CHI@UC for two days using the legacy imperative surface, with the
  manual start and end date lines left commented in place so a reader can switch from an immediate lease
  to a scheduled one by uncommenting. Reads the project name from the environment. Ends with a guarded
  teardown that deletes the server and releases the reserved floating IP.
