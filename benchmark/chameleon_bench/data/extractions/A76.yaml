preconditions:
- Assumes the OS_PROJECT_NAME environment variable is set, since it is read and passed to chi.set.
- Assumes the USER environment variable is set, since every resource name is prefixed with it.
- Assumes a NODE_TYPE variable is defined before the lease cell.
- Assumes the server is attached to the shared network, since the floating IP is read out of that network's
  address list.
traps_illustrated:
- The lease is created with a v1 suffix and then fetched with a v3 suffix in the very next cell, so the
  notebook as extracted does not fetch the lease it just created.
- A third suffix appears in the second half of the notebook, so three different lease names coexist in
  one file.
- The floating IP is recovered by filtering the server's address list on an OpenStack extension field
  rather than from the lease.
- Manual start and end dates are left commented in place, which documents scheduled leases but is easy
  to half-uncomment.
- Teardown is guarded by a DELETE flag defaulting to false, so the cell is present but inert unless edited.
not_covered:
- No KVM or container path; bare metal only.
- No image build; a published image is named.
- No floating IP reservation in the lease cell, though the teardown tries to release one.
- No multi-node or distributed path.
