preconditions:
- Assumes the reader edits the placeholder project id in the auth cell, which ships as a literal placeholder
  string.
- Assumes the USER environment variable is set, since it prefixes the server name.
- Assumes at least one floating IP is already allocated to the project and unattached, because the notebook
  picks one from the existing pool rather than reserving one.
- Assumes the requested GPU node type is free for an immediate two-hour window.
- Assumes fabric is installed, since the notebook imports Connection for the post-provisioning steps.
traps_illustrated:
- The project id ships as an uppercase placeholder rather than a real value, so the notebook fails immediately
  unless edited.
- The floating IP is scavenged from the project pool by filtering on an absent port id, so a concurrent
  run can take the same address.
- reservation_id is read out of the raw lease dictionary by index rather than through get_node_reservation.
- The server name says power-management while the artifact reconstructs neural implicit maps, a leftover
  from the template it was copied from.
- Two hours is a short window for a reconstruction workload, so the lease can expire mid-run.
not_covered:
- No teardown; neither lease nor server is deleted in the extracted cells.
- No KVM or container path; bare metal only.
- No image build; a published CUDA image is used.
- No multi-node or distributed path, despite the method being about submap optimization.
