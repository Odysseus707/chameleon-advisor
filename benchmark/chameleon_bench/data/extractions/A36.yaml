summary: A reproduction attempt of MISO, a multiresolution submap optimization method for globally consistent
  neural implicit reconstruction, run on a Chameleon GPU node. Uses the legacy imperative python-chi surface
  to reserve a Tesla-class GPU node at a bare-metal site for two hours, then launches a CUDA image against
  the reservation. Distinctively for this corpus it drives the machine afterwards over SSH through a fabric
  Connection, and it finds a floating IP by listing every IP allocated to the project and filtering for
  one with no port attached, rather than reserving a fresh one in the lease.
workflow_stages:
- stage: lease
  verbatim_code: |-
    import chi
    from chi import lease, server
    from fabric import Connection
    import os
    import time
    import sys

    chi.use_site("CHI@TACC")
    chi.set("project_name", "YOUR-PROJECT-ID")  # Your Project ID

    print("Reserving a Tesla P100 GPU node...")
    reservations = []
    lease_node_type = "gpu_p100"

    try:
        lease.add_fip_reservation(reservations, count=1)
        lease.add_node_reservation(reservations, node_type=lease_node_type, count=1)
        start, end = lease.lease_duration(hours=2)

        # Create the lease
        my_lease = lease.create_lease(
            f"{os.getenv('USER')}-reproduce-miso",
            reservations,
            start_date=start,
            end_date=end
        )
    except Exception as e:
        print("Failed to create lease:")
        print(e)
        sys.exit(1)

    print("Lease created, go to the GUI portal to check if the lease is active...")
  source_ref: main.ipynb cell 1
- stage: server
  verbatim_code: |-
    image = "CC-Ubuntu20.04-CUDA"
    lease_id = my_lease["id"]
    reservation_id = my_lease['reservations'][0]['id']

    my_server = server.create_server(
       f"{os.getenv('USER')}-power-management",
       image_name=image,
       reservation_id=reservation_id
    )

    print("Waiting for server to start ...")
    server.wait_for_active(my_server.id)
    print("Done")
  source_ref: main.ipynb cell 2
