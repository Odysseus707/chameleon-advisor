  on Chameleon bare metal at CHI@TACC. Uses the legacy imperative surface throughout and does something
  no other artifact in this corpus does: it reserves specific named hosts by resource_properties, matching
  on the node_name field rather than on a node type, creating one lease per node. Launches each compute
  instance from a custom saved image against an isolated network, so the artifact carries a private image
  reference and a named network rather than a published image.'
