preconditions:
- Assumes a Chameleon account whose project matches the project id hardcoded in the auth cell.
- Assumes the two specific named hosts are free at CHI@TACC, since they are requested by name and no fallback
  exists.
- Assumes a custom image saved from an earlier run is present in the project, because the server cell
  names an image by its snapshot identifier.
- Assumes the named isolated network already exists; the server cell attaches to it by name.
traps_illustrated:
- Hosts are reserved by resource_properties matching node_name, not by node type, which pins the lease
  to two physical machines and fails outright if either is busy.
- One lease is created per node rather than one lease with a count, so a partial failure leaves an orphan
  lease.
- The image is a project-private snapshot identified by a uuid suffix, so the notebook is not reproducible
  outside the project that created it.
- The network is named literally, including a generated suffix, so it cannot be recreated from the notebook
  alone.
- The printed lease-status link points at a different Chameleon site's dashboard than the one being used.
not_covered:
- No teardown in the extracted cells.
- No KVM or container path; bare metal only.
- No image build step, though a custom image is consumed.
- No node type declaration at all, so the artifact says nothing about which hardware class was used.
