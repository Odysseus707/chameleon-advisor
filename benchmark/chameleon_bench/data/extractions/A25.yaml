preconditions:
- Assumes a Chameleon account whose project matches the project id hardcoded in the first cell.
- Assumes a USER variable is already defined; the lease key interpolates it and the extraction does not
  show where it is set.
- Assumes keystoneauth1 and blazarclient are importable, since the lease cell catches exceptions from
  both by name.
- Assumes the requested CPU node type is free at CHI@UC for an immediate three-hour window.
traps_illustrated:
- The project id is hardcoded rather than read from the environment, so the notebook fails for any other
  project.
- The lease key embeds a timestamp taken before the request, so a retry after a failure produces a different
  name and leaks the earlier lease.
- The same key names both the lease and the server, which couples their lifetimes without any code enforcing
  it.
- The image is bound to a local variable in the server cell rather than declared with the rest of the
  configuration.
- 'Legacy-era API: an explicit start_date and end_date pair from lease.lease_duration rather than a duration
  on a Lease object.'
not_covered:
- No teardown; neither lease nor server is deleted in the extracted cells.
- No KVM or container path; bare metal only.
- No image build or registration.
- No floating IP association step, despite the IP being reserved.
- The Flink build and the reproduction steps themselves are outside the extracted provisioning surface.
