summary: A minimal bug reproduction for a specific Apache Flink issue, provisioned on Chameleon bare metal.
  Uses the legacy imperative python-chi surface (chi.use_site, chi.set, lease.add_node_reservation, lease.create_lease,
  server.create_server) to reserve one CPU node plus a floating IP at CHI@UC for three hours, then launch
  an Ubuntu server. The lease name embeds a unix timestamp taken at request time alongside the node type,
  so each run produces a distinct lease, and that same key is reused as the server name. Lease creation
  is wrapped in handlers that distinguish an authorization failure from an unavailable node.
workflow_stages:
- stage: site/auth
  verbatim_code: |-
    import chi

    chi.use_site("CHI@UC")
    chi.set("project_name", "CHI-220969")

    print(f'Using Project {chi.get("project_name")}')
  source_ref: Setup.ipynb cell 1
- stage: lease
  verbatim_code: |-
    import time
    import keystoneauth1, blazarclient
    from chi import lease

    reservations = []
    reservation_req_time = int(time.time())
    LEASE_KEY = f"{USER}-compute_skylake-{reservation_req_time}"

    try:
        print(f"Creating lease with name = {LEASE_KEY}...")
        lease.add_fip_reservation(reservations, count=1)
        lease.add_node_reservation(reservations, count=1, node_type="compute_skylake")

        start_date, end_date = lease.lease_duration(hours=3, days=0)

        l = lease.create_lease(
            LEASE_KEY,
            reservations,
            start_date=start_date,
            end_date=end_date
        )
        lease_id = l["id"]

        print("Waiting for lease to start ...")
        lease.wait_for_active(lease_id)
        print("Lease is now active!")
    except keystoneauth1.exceptions.http.Unauthorized as e:
        print("Unauthorized.\nDid set your project name and and run the code in the first cell?")
    except blazarclient.exception.BlazarClientException as e:
        print(f"There is an issue making the reservation. Please check the host calendar.")
        print("https://chi.uc.chameleoncloud.org/project/leases/calendar/host/")
        print(e)
    except Exception as e:
        print("An unexpected error happened.")
        print(e)
  source_ref: Setup.ipynb cell 3
- stage: server
  verbatim_code: |-
    from chi import server

    image = "CC-Ubuntu22.04"

    s = server.create_server(
        LEASE_KEY,
        image_name=image,
        reservation_id=lease.get_node_reservation(lease_id)
    )

    print("Waiting for server to start ...")
    server.wait_for_active(s.id)
    print("Done")
  source_ref: Setup.ipynb cell 4
