summary: 'A teaching tutorial, third in a three-part series, on evaluating machine learning systems by
  closing the feedback loop from production back into training data. Runs on KVM@TACC and reserves a flavor
  rather than a bare-metal host: a single m1.medium reserved through add_flavor_reservation with a flavor
  id looked up by name. Uses the current context and Lease objects, and is written to be driven from the
  Chameleon Jupyter environment, which every provisioning cell says in a comment. Unusually for this corpus
  it ships an explicit teardown notebook that deletes both the server and the lease, and a separate notebook
  that prepares security groups.'
