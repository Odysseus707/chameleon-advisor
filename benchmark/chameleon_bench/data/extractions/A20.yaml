preconditions:
- Assumes the notebooks are run from the Chameleon Jupyter environment, which each provisioning cell states
  in a comment.
- Assumes the USER environment variable is set, since every resource name is prefixed with it.
- Assumes a project is selectable interactively; choose_project is called with no arguments.
- Assumes the requested flavor is available at KVM@TACC for the six-hour lease window.
traps_illustrated:
- 'KVM reserves a flavor, not a host: the reservation is made by flavor id obtained from a name lookup,
  which is a different grammar from the bare-metal node reservation used elsewhere in this corpus.'
- Resource names are interpolated from USER in both the create and delete notebooks, so a mismatch between
  them silently fails to find the resource to delete.
- Security group setup lives in its own notebook rather than in the provisioning path, so it is easy to
  skip.
- Several different lease durations appear across the notebooks, so the declared hours are not a single
  value for the artifact.
not_covered:
- No bare-metal path; this is a KVM artifact throughout.
- No GPU or accelerator use.
- No image build; a published Ubuntu image is used.
- No floating IP reservation, though networking is configured separately.
