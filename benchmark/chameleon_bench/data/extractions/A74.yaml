summary: A reproducibility study of the Lottery Ticket Hypothesis paper from ICLR 2019, testing whether
  sparse trainable sub-networks exist inside a randomly initialised dense network. Provisions a GPU node
  plus a floating IP at CHI@UC for six hours using the legacy imperative surface, then launches a server
  against the node reservation. Unlike most legacy artifacts here the lease cell carries no exception
  handling at all, so a reservation failure surfaces as a raw traceback.
workflow_stages:
- stage: site/auth
  verbatim_code: |-
    import chi
    chi.use_site("CHI@UC")

    project_id = "CHI-251412"
    chi.set("project_name", project_id)
  source_ref: repro-lottery-ticket-hyptothesis.ipynb cell 1
- stage: lease
  verbatim_code: |-
    from chi import lease
    import time
    import os

    reservations = []
    lease_node_type = "gpu_rtx_6000"

    lease.add_fip_reservation(reservations, count=1)
    lease.add_node_reservation(reservations, node_type=lease_node_type, count=1)

    start_date, end_date = lease.lease_duration(hours=6)

    l = lease.create_lease(
        f"{os.getenv('USER')}-lottery-repro",
        reservations,
        start_date=start_date,
        end_date=end_date
    )
    lease_id = l["id"]
    lease.wait_for_active(lease_id)
  source_ref: repro-lottery-ticket-hyptothesis.ipynb cell 2
- stage: server
  verbatim_code: |-
    from chi import server

    image = "CC-Ubuntu20.04"
    s = server.create_server(
        f"{os.getenv('USER')}-lottery-repro",
        image_name=image,
        reservation_id=lease.get_node_reservation(lease_id)
    )

    server.wait_for_active(s.id)
  source_ref: repro-lottery-ticket-hyptothesis.ipynb cell 3
