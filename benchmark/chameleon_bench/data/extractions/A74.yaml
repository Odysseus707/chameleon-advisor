preconditions:
- Assumes the hardcoded project id matches the reader's own project.
- Assumes the USER environment variable is set, since it prefixes both the lease and the server name.
- Assumes the requested GPU node type is free at CHI@UC for an immediate six-hour window.
- Assumes the published image bound in the server cell is available at the site.
traps_illustrated:
- The lease cell has no exception handling, so an unavailable node type produces a raw traceback rather
  than the guidance every sibling artifact prints.
- The project id is hardcoded rather than read from the environment.
- reservation_id is obtained from lease.get_node_reservation on the lease id, not from the lease id itself.
- The image named is an older release than the artifact's era suggests.
- Six hours is a short window for the iterative prune-and-retrain loop the hypothesis requires.
