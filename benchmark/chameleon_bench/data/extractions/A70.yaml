summary: 'A reproduction of CrossPrefetch, work on accelerating I/O prefetching for modern storage, run
  on Chameleon bare metal at CHI@TACC. Provisioning is legacy-era: a CPU node plus a floating IP reserved
  for six hours, then a server launched against the node reservation. The lease key embeds both the paper
  venue and a unix timestamp taken at request time, so every run produces a distinct lease and the name
  records which paper it belongs to. The same key names the server.'
