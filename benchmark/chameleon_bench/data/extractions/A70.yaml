preconditions:
- Assumes the hardcoded project name matches the reader's own project.
- Assumes a USER variable is defined; the lease key interpolates it and the extraction does not show where
  it is set.
- Assumes keystoneauth1 and blazarclient are importable, since the lease cell imports both.
- Assumes the requested CPU node type is free at CHI@TACC for an immediate six-hour window.
traps_illustrated:
- The lease key embeds a timestamp taken before the request, so a retry after failure produces a different
  name and leaks the earlier lease.
- The project name is hardcoded rather than read from the environment.
- reservation_id is obtained from lease.get_node_reservation on the lease id, not from the lease id itself.
- A floating IP is added to the same reservations list as the node, with no association step in the extracted
  cells.
- Six hours is a short window for a storage benchmark campaign.
not_covered:
- No teardown in the extracted cells.
- No KVM or container path; bare metal only.
- No image build; a published image is bound to a variable.
- No floating IP association step, despite the IP being reserved.
