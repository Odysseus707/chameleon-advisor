summary: 'Launches a container running JupyterLab and OpenCode Web against a shared workspace on a Chameleon
  virtual machine, with parallel CPU and GPU deployment notebooks and a matching cleanup notebook. Uses
  the current python-chi object API and the KVM grammar: a Lease reserves a flavor resolved by name through
  server.get_flavor_id, measured in days rather than hours. Notably it changes site mid-notebook, selecting
  one site to mint S3 credentials through the identity API and another to place the lease.'
