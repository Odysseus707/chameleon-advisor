preconditions:
- Assumes DEPLOYMENT_TYPE is set to exactly cpu or gpu; the notebook raises otherwise.
- Assumes LEASE_DAYS is a positive number and VOLUME_SIZE_GB is a positive integer or None, both validated
  explicitly.
- Assumes context.version = "1.0" is set before other python-chi calls.
- Assumes the USER environment variable is set, since every resource name is derived from it.
- Assumes the project can mint EC2-style credentials, since S3 access is obtained through the identity
  endpoint.
traps_illustrated:
- The site is chosen twice with different defaults in the same notebook - one for the credential step
  and another for the lease - so a reader who assumes a single site will place resources in the wrong
  place.
- 'KVM grammar: add_flavor_reservation with an id from server.get_flavor_id, not add_node_reservation
  with a node type.'
- Lease duration is expressed in days, unlike most artifacts in this corpus which use hours.
- Inputs are validated with explicit raises before any resource is created, so a bad parameter fails before
  it costs an allocation.
- S3 credentials are cached to a per-project file under the home directory and reused if present, rather
  than minted every run.
- Every resource name derives from a single RESOURCE_PREFIX, so the cleanup notebook can reconstruct them
  without being told.
not_covered:
- No bare-metal node reservation; this is the virtual-machine path.
- No floating IP reservation in the extracted cells, since Docker publishes the services on the VM interfaces.
- No image is passed to a reservation call, only bound to a variable.
- No multi-node or cluster configuration.
memorization_probes:
- raise ValueError("DEPLOYMENT_TYPE must be 'cpu' or 'gpu'")
- l.add_flavor_reservation(id=server.get_flavor_id(FLAVOR), amount=1)
- This container runs JupyterLab and OpenCode Web against the same workspace.
uncertainties:
- The registry lists flavors named gpu.ipynb and gpu.yaml, which are filename fragments picked up by the
  flavor regex rather than real flavors.
- The flavor and image are bound to variables before use, so neither appears as a literal call kwarg even
  though both are literals in the source.
