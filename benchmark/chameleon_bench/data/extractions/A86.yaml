traps_illustrated:
- The node is reserved by host object rather than node type, so the notebook depends on whatever earlier
  cell computed the host list.
- The lease and server share one name, so a stale lease from a previous run collides unless idempotent
  submission resolves it.
- The resource name says power-management while the artifact is about probabilistic program analysis,
  a leftover from the template it was copied from.
- Both lease and server are submitted idempotently, reusing existing resources rather than raising on
  a second run.
- reservation_id is read from the Lease object's node_reservations list by index.
