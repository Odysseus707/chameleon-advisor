preconditions:
- Assumes the notebooks run from the Chameleon Jupyter environment, which every provisioning cell states
  in a comment.
- Assumes a lease already exists under a fixed name; the notebook calls get_lease rather than creating
  one.
- Assumes the USER environment variable is set, since it suffixes the server name.
- Assumes a CUDA-enabled Ubuntu image is published at the site, since the image is looked up by name through
  the OpenStack image API.
traps_illustrated:
- The lease is fetched by a hardcoded name containing a placeholder netID, so the notebook fails until
  that placeholder is edited.
- Provisioning drops out of python-chi into the raw OpenStack connection and cinder client, so the failure
  modes are OpenStack's rather than python-chi's.
- The image is resolved by listing images matching a name and taking the first result, which is order-dependent
  if more than one matches.
- Server creation is wrapped in a bare except that treats any failure of get_server as absence.
- The GPU flavor is the scarcest resource on the testbed, so a lease that does exist may still never become
  active.
not_covered:
- No lease creation; the notebook assumes one exists.
- No bare-metal node reservation path in the extracted cells, despite the registry listing a bare-metal
  site.
- No teardown in the extracted cells.
- No image build; a published CUDA image is used.
