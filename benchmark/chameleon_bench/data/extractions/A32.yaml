summary: 'The H100 variant of a teaching tutorial on large-scale model training, practising fine-tuning
  of a large language model with techniques that let it fit in GPU memory: gradient accumulation, reduced
  precision, activation checkpointing, CPU offload, parameter efficient fine tuning, and distributed training
  across multiple GPUs. Reserves an H100 GPU flavor rather than a bare-metal host. Ships parallel single-GPU
  and multi-GPU notebook paths with the same provisioning shape. Provisioning is mixed-era: the current
  context and Lease objects for site and lease, with the raw OpenStack connection and cinder client reached
  through chi.clients to resolve a CUDA image and build a boot volume.'
