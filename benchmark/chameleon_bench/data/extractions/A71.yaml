summary: 'A reproduction of the Deep Neural Nets thirty-three years retrospective, packaged as a teaching
  artifact. Provisions a CPU node plus a floating IP at CHI@UC for eight hours using the legacy imperative
  surface, and reads the project name from the environment rather than hardcoding it, which is rare in
  this corpus. Its teardown is the most complete here: guarded by a DELETE flag, it deletes the server,
  then releases the reserved floating IP by resolving it through the network module and calling the raw
  neutron client, then deletes the lease. Most artifacts reserve a floating IP and never release it.'
