summary: FlashNet, a reproducible data science platform for storage systems, aimed at benchmarking machine-learning-based
  per-IO latency prediction the way ImageNet benchmarks drove image recognition. Provisions one CPU node
  plus a floating IP at CHI@UC for a full day using the legacy imperative python-chi surface (chi.use_site,
  lease.add_node_reservation, lease.create_lease, server.create_server), then launches an Ubuntu server
  against the node reservation. Every resource name is suffixed with a uuid4 generated in the first cell,
  so repeated runs do not collide. Lease creation is wrapped in exception handling that separates an authorization
  failure from an unavailable node and points the reader at the host calendar.
workflow_stages:
- stage: site/auth
  verbatim_code: |-
    import chi
    from chi import lease, server
    import os
    import keystoneauth1, blazarclient
    import uuid

    CLOUD_SITE = "CHI@UC"

    PROJECT_ID = "CHI-231080"
    chi.set("project_name", PROJECT_ID)
    chi.use_site(CLOUD_SITE)
    uid_this = str(uuid.uuid4())

    print(f"UID for this experiment is {uid_this}")
  source_ref: readme-remoteserver-chi.ipynb cell 1
- stage: lease
  verbatim_code: |-
    reservations = []
    try:
        print("Creating lease...")
        lease.add_fip_reservation(reservations, count=1)
        lease.add_node_reservation(reservations, count=1, node_type="compute_skylake")

        start_date, end_date = lease.lease_duration(days=1)

        l = lease.create_lease(f"flashnet-{uid_this}", reservations, start_date=start_date, end_date=end_date)
        cloud_lease_id = l["id"]

        print("Waiting for lease to start ... This can take up to 1 min ...")
        lease.wait_for_active(cloud_lease_id)
        print("Lease is now active!")

    except keystoneauth1.exceptions.http.Unauthorized as e:
        print("Unauthorized.\nDid set your project name and and run the code in the first cell?")

    except blazarclient.exception.BlazarClientException as e:
        print(f"There is an issue making the reservation. Check the calendar to make sure a node is available.")
        print("https://chi.uc.chameleoncloud.org/project/leases/calendar/host/")
        print(e)

    except Exception as e:
        print("An unexpected error happened.")
        print(e)
  source_ref: readme-remoteserver-chi.ipynb cell 2
- stage: server
  verbatim_code: |-
    s = server.create_server(
        f"flashnet-{uid_this}",
        image_name="CC-Ubuntu20.04",
        reservation_id=lease.get_node_reservation(cloud_lease_id))

    print("Waiting for server to start ...")
    server.wait_for_active(s.id)
    print("Done")
  source_ref: readme-remoteserver-chi.ipynb cell 3
