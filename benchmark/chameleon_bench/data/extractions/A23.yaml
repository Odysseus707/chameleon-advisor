preconditions:
- Assumes a Chameleon account whose project matches the project id hardcoded in the first cell.
- Assumes keystoneauth1 and blazarclient are importable, since the lease cell catches exceptions from
  both by name.
- Assumes the requested CPU node type is free at CHI@UC, because the lease is created for an immediate
  one-day window and waited on.
- Assumes the published Ubuntu image named in create_server exists at the site.
traps_illustrated:
- The project id is hardcoded rather than read from the environment, so the notebook fails for any other
  project.
- A floating IP is added to the same reservations list as the node before create_lease, rather than reserved
  separately.
- reservation_id is obtained from lease.get_node_reservation on the lease id, not from the lease id itself.
- An unavailable node type is caught separately from an authorization failure and the handler links the
  host calendar instead of retrying.
- 'Legacy-era API: an explicit start_date and end_date pair from lease.lease_duration rather than a duration
  on a Lease object.'
not_covered:
- No teardown; neither the lease nor the server is deleted in the extracted cells.
- No KVM or container path; bare metal only.
- No image build or registration; a published image is used.
- No floating IP association step, despite the IP being reserved.
- The storage node type the registry records is not reserved anywhere in the extracted provisioning.
