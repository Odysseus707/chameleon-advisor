preconditions:
- Assumes lease_name, flavor_name and hours are defined in an earlier configuration cell.
- Assumes the named edge lease already exists, since that notebook only fetches it.
- Assumes context.version = "1.0" is set, which every entry notebook repeats.
- Assumes the reader picks the notebook matching their intended site, as the variants target different
  infrastructure.
traps_illustrated:
- Different notebooks default to different sites, so which infrastructure is used depends entirely on
  which file is opened.
- The edge path calls lease.get_lease on a hardcoded lease name rather than creating a reservation, so
  nothing there shows how the lease was obtained.
- The KVM path uses add_flavor_reservation with an id from get_flavor_id, the virtual-machine grammar
  rather than a node type.
- The notebook imports cinder, nova and neutron clients directly, which is the escape hatch for actions
  python-chi does not wrap.
- A boot-from-volume variant exists alongside the direct-instance one, and the two are not interchangeable.
