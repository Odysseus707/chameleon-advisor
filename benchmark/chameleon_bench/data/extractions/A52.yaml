summary: 'OpenMCP, a reproducible benchmarking harness for evaluating computer-use agents built on Model
  Context Protocols, deployed across several Chameleon sites. Unusually for this corpus it spans multiple
  deployment paths in one repository: an edge notebook that attaches to a pre-existing named lease, a
  KVM notebook that reserves a flavor and launches an instance directly, and a further variant that boots
  from a volume. It reaches past python-chi to the underlying cinder, nova and neutron clients for operations
  the wrapper does not cover, and serves models through an Ollama container image.'
