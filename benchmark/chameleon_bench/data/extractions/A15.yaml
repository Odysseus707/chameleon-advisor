preconditions:
- Assumes context.version = "1.0" is set, otherwise the functional interface returns the old types.
- Assumes the USER environment variable is set, since it prefixes every resource name.
- Assumes a routable floating IP is available, because Colab connects to the server from outside.
- Assumes the reader picks the notebook matching their GPU vendor, as the two variants are not interchangeable.
traps_illustrated:
- Two vendor variants differ only in node type, so choosing the wrong notebook reserves hardware the image
  cannot drive.
- submit(idempotent=True) makes the reservation cell safe to re-run rather than creating a duplicate lease.
- Later cells re-attach with lease.get_lease using the same f-string name, so the lease name is load-bearing
  across the notebook.
- The floating IP is reserved in the same lease as the node, before submit, rather than requested afterwards.
- The environment-setup cell repeats the context block and warns that edits made at the top must be mirrored
  there.
