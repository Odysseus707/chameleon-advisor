summary: 'Teaching artifact that connects a Google Colab front end to a bare-metal GPU server on Chameleon,
  so a user keeps Colab''s interface while running on hardware Colab''s hosted runtime cannot provide.
  Ships two parallel notebooks, one for an AMD GPU node and one for an NVIDIA one, which are identical
  except for the node type and image. Uses the current python-chi object API: a Lease with an eight-hour
  duration and an explicit start date, a node reservation by node type, and a floating IP reserved in
  the same lease so Colab can reach the server.'
