preconditions:
- Assumes the reader replaces the placeholder project name before running anything.
- Assumes an SSH key is registered at the KVM site.
- Assumes a node configuration list is defined earlier, since server creation iterates over it.
- Assumes Kubespray and its Ansible dependencies are available to configure the cluster after provisioning.
traps_illustrated:
- The project name is a literal placeholder, so an unedited run fails immediately.
- python-chi is used only for context; instances are created through an openstacksdk connection, which
  is the documented escape hatch for unsupported actions.
- The image is resolved from a name to a uuid at run time rather than passed as a name.
- Servers are created in a loop from a configuration list, so node count is data rather than a literal.
- The delete notebook repeats the site and project block, so teardown depends on selecting the same context
  as creation.
not_covered:
- No bare-metal node reservation; this is the virtual-machine path.
- No lease is created at all, since the KVM site does not require one for these instances.
- No GPU or accelerator configuration.
- No floating IP reservation in the extracted cells.
