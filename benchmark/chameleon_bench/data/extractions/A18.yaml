summary: Teaching recipe that deploys a Kubernetes cluster with Kubespray onto virtual machines at the
  KVM site, with a parallel path for a different testbed. Uses the legacy python-chi surface only to establish
  site and project, then deliberately drops to openstacksdk through chi.clients.connection() for the work
  python-chi does not cover, creating each node from a per-node configuration list and resolving the image
  by name to a uuid. Ships a companion delete notebook that re-establishes the same context before tearing
  down.
