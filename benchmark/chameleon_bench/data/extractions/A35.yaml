preconditions:
- Assumes the reader edits the hardcoded site and project id, which the inline comments instruct them
  to do.
- Assumes available_nodes was populated by an earlier query cell, since the reservation indexes into it.
- Assumes context.version = "1.0" is set, which both context cells repeat.
- Assumes the named object storage bucket already exists before the download cell runs.
traps_illustrated:
- Two different site-selection idioms appear in one notebook - a direct use_site call and an interactive
  choose_site with a different default - so which site is used depends on which cells were run.
- The project id is hardcoded with an instruction to change it, so an unedited run targets someone else's
  project.
- reservation_id is threaded from my_lease.node_reservations[0]["id"] into Server rather than from the
  lease id.
- The node is taken as available_nodes[0] rather than by node_type.
- Results are retrieved from an object bucket rather than from the server, so the download cell does not
  need the lease to still be active.
