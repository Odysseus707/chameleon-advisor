summary: 'A reproduction of the ASPLOS 2023 LeaFTL paper on a learning-based flash translation layer for
  solid-state drives, run on Chameleon bare metal. Provisioning is legacy-era and written to be re-runnable:
  both the lease and the server are fetched by name inside try blocks and created only when absent, so
  a second run attaches to what already exists rather than duplicating it. The network cell then takes
  a reserved floating IP off the lease object and attaches it to the server, which is the association
  step most artifacts in this corpus reserve an IP for and never perform.'
