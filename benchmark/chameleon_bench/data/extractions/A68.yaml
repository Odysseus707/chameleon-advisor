preconditions:
- Assumes a USER variable is defined; the lease key interpolates it and the extraction does not show where
  it is set.
- Assumes the hardcoded project name matches the reader's own project.
- Assumes keystoneauth1 and blazarclient are importable, since the lease cell imports both.
- Assumes the requested CPU node type is free at CHI@UC for a two-hour window.
traps_illustrated:
- Get-then-create is used for both lease and server, wrapped in bare excepts that treat any failure as
  absence, so an authentication error reads as a missing resource.
- The floating IP is read off the lease object and associated with the server, which is the step most
  artifacts here omit after reserving one.
- The project name is hardcoded and uses a different prefix form from most artifacts in this corpus.
- Two hours is a short window for a storage reproduction, so the lease can expire mid-run.
- The lease key doubles as the server name, coupling their lifetimes without any code enforcing it.
not_covered:
- No teardown in the extracted cells.
- No KVM or container path; bare metal only.
- No image build; a published image is bound to a variable.
- No SSD hardware reservation; the reproduction runs on a general CPU node.
