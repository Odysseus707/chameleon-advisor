preconditions:
- Assumes the notebook runs inside Chameleon Trovi, which the README states twice in its own header.
- Assumes the USER environment variable is set, since it prefixes both the lease and the server name.
- Assumes available_nodes has already been populated by an earlier cell the extraction does not capture.
- Assumes a site and project are selectable interactively; both are chosen with no arguments.
traps_illustrated:
- The node is reserved by host object rather than by node type, so the notebook depends on whatever earlier
  cell filled available_nodes.
- The lease and server names are the same string, so a stale lease from a previous run collides with the
  new server unless idempotent submission resolves it.
- Both lease and server are submitted with idempotent set true, which reuses existing resources rather
  than raising on a second run.
- reservation_id is read from my_lease.node_reservations[0] on the Lease object, which is the current-era
  equivalent of the legacy get_node_reservation call.
- The lease name says power-management while the artifact is about flaky tests, a leftover from the template
  the notebook was copied from.
