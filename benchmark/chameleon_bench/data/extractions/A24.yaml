summary: 'FLEX, a reproducible paper experiment on fixing flaky tests in machine learning projects, packaged
  to run inside Chameleon Trovi and driven from a single reproduce notebook. Uses the current object-oriented
  python-chi surface end to end: context.choose_site, a Lease with a timedelta duration, and a Server
  object submitted idempotently. Reserves one node plus a floating IP for three hours and launches an
  Ubuntu server against the first node reservation. The node is selected by passing a host out of available_nodes
  rather than by naming a node type, and every resource name is derived from the USER environment variable.'
