traps_illustrated:
- A six-day reservation on shared GPU hardware is an exceptionally long hold, and the notebook does not
  explain why it needs one.
- The notebook is split into halves and warns that a change in the first must be repeated in the second.
- Resource names carry a version suffix, so an earlier run's resources are orphaned rather than reused
  when it changes.
- The image comes from the chi settings rather than being named, so the artifact does not record what
  it ran on.
- 'Legacy-era API: an explicit start_date and end_date pair from lease.lease_duration.'
