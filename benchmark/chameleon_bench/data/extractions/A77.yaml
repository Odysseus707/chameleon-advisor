preconditions:
- Assumes the OS_PROJECT_NAME environment variable is set, since it is read and passed to chi.set.
- Assumes the USER environment variable is set, since every resource name is prefixed with it.
- Assumes a NODE_TYPE variable is defined before the lease cell.
- Assumes the requested GPU node type is free at CHI@UC for an immediate eight-hour window.
traps_illustrated:
- Parallel notebooks provision the same experiment on different base images, so a fix applied to one silently
  misses the others.
- Resource names interpolate the node type and the image family, so changing either silently renames everything
  and orphans the old resources.
- Teardown is guarded by a DELETE flag defaulting to false.
- 'Legacy-era API: an explicit start_date and end_date pair from lease.lease_duration.'
- The notebook name carries Colab in it while the artifact runs on Chameleon, which is a leftover from
  the workflow it was adapted from.
not_covered:
- No KVM or container path; bare metal only.
- No image build; published images are used.
- No floating IP association step, despite the IP being reserved.
- No quantitative comparison; the study is explicitly about qualitative claims.
memorization_probes:
- l = lease.create_lease(f"{os.getenv('USER')}-{NODE_TYPE}-ubuntu", res, start_date=start_date, end_date=end_date)
- PROJECT_NAME = os.getenv('OS_PROJECT_NAME')
- lease.add_fip_reservation(res, count=1)
uncertainties:
- lease_hours_declared includes a zero, which is the days argument of lease.lease_duration being read
  as an hours declaration.
- The registry records the same accelerator under two spellings plus a third model, which is the ranking
  pass matching several forms across the repository.
- images is empty although the notebooks are named for the base images they use, because no image literal
