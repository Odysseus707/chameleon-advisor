summary: A reproduction validating qualitative claims from the Tacotron2 text-to-speech paper, which conditions
  WaveNet on mel spectrogram predictions. Provisions a GPU node plus a floating IP at CHI@UC for eight
  hours using the legacy imperative surface, reading the project name from the environment. The repository
  ships parallel notebooks for different base environments, each with its own site, lease, server and
  guarded teardown stage, so the same experiment is provisioned more than one way.
