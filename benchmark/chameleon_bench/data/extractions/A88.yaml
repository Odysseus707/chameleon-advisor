preconditions:
- Assumes the USER environment variable is set, since every resource name is prefixed with it.
- Assumes a node_type variable and a lease_start variable are defined before the lease cell.
- Assumes a site and project are selectable interactively; both are chosen with no arguments.
- Assumes the requested GPU node type is free for the requested window.
traps_illustrated:
- The lease takes an explicit start_date, so it can be created for a future window and then appear not
  to start.
- The notebook is split into halves and warns that a change in the first must be repeated in the second.
- The lease name interpolates the node type, so changing hardware silently renames the lease and orphans
  the old one.
- The second half imports a magic module that the first half does not, so the two halves do not have the
  same environment.
- Submission is idempotent, so re-running reuses an existing lease.
