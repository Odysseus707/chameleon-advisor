summary: A Chameleon bare-metal experiment pattern that captures power and energy measurements directly
  from a physical node while varying the proportion of node cores a load runs on. Uses the current python-chi
  context API (context.version = "1.0", then choose_site/choose_project) rather than the legacy functional
  interface. Reserves one bare-metal node and a floating IP in a single 3-hour lease, launches a CC-Ubuntu22.04
  server against that reservation, runs the experiment, and downloads results from a dated object store
  bucket for analysis in a second notebook.
