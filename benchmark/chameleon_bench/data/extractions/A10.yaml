preconditions:
- Assumes a Chameleon account with an active project allocation.
- Assumes context.version = "1.0" is set, otherwise the functional interface returns the old types.
- Assumes available_nodes was populated by an earlier hardware-query cell, which contains no provisioning
  call and is omitted from the grounding document.
- Assumes at least one matching node is free, because the lease starts immediately.
- Assumes the experiment has run at least once, so the dated object store bucket exists before the download
  cell.
traps_illustrated:
- One lease carries both reservations - add_node_reservation and add_fip_reservation are called on the
  same lease before submit.
- reservation_id comes from my_lease.node_reservations[0]["id"], not from the lease id itself.
- submit(idempotent=True) on both the Lease and the Server, so re-running the notebook does not create
  duplicates.
- context.version = "1.0" is required to opt into the new python-chi types.
- The node is chosen as available_nodes[0] rather than by node_type, so the reservation depends on a prior
  query cell.
