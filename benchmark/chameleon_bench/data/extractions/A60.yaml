preconditions:
- Assumes the OS_PROJECT_NAME environment variable is set, since it is read and passed to chi.set.
- Assumes the USER environment variable is set, since every resource name interpolates it alongside the
  node type.
- Assumes an image is configured in the chi settings, because create_server reads it from chi.get rather
  than naming one.
- 'Assumes the reader is willing to wait: the lease does not start for sixteen hours.'
traps_illustrated:
- The lease is future-dated by sixteen hours, so wait_for_active blocks for most of a day and a reader
  expecting an immediate node sees a hang rather than an error.
- A comment warns not to re-run the lease-creation cell, because a second run creates a second lease rather
  than reusing the first.
- The notebook is split into halves and warns that a change in the first must be repeated in the second.
- The lease is re-fetched by name in a later cell specifically to survive a runtime restart, which is
  a real notebook failure mode.
- Resource names interpolate the node type, so changing hardware silently renames every resource and orphans
  the old ones.
not_covered:
- No KVM or container path; bare metal only.
- No image build; the image comes from the chi settings.
- No multi-node or distributed training path.
- No floating IP association step, despite the IP being reserved.
