summary: 'A reproduction of the Vision Transformer paper, built as an interactive teaching notebook for
  a summer of reproducibility fellowship and aimed at showing students different levels of reproducibility
  in computer vision research. Provisions a GPU node plus a floating IP at CHI@UC using the legacy imperative
  surface. Distinctively for this corpus the lease is FUTURE-DATED: the start is set sixteen hours from
  the moment the cell runs and the window is two days long, so the notebook reserves scarce hardware ahead
  of time rather than competing for it now. Every step carries a parenthetical instruction to the student,
  and the notebook ends with a teardown stage.'
