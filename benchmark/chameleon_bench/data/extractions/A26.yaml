preconditions:
- Assumes a Chameleon account whose project matches the project id hardcoded in the first cell, which
  the comment invites the reader to change.
- Assumes the USER environment variable is set, since it prefixes both the lease and the server name.
- Assumes keystoneauth1 and blazarclient are importable, since the lease cell catches exceptions from
  both by name.
- Assumes the requested CPU node type is free at CHI@UC for an immediate three-hour window.
traps_illustrated:
- The project id is hardcoded rather than read from the environment, with only a comment telling the reader
  to change it.
- The node type is a variable interpolated into the failure message, so the error text stays correct when
  the hardware is changed.
- A floating IP is added to the same reservations list as the node before create_lease.
- reservation_id is obtained from lease.get_node_reservation on the lease id, not from the lease id itself.
- 'Legacy-era API: an explicit start_date and end_date pair from lease.lease_duration rather than a duration
  on a Lease object.'
not_covered:
- No teardown; neither lease nor server is deleted in the extracted cells.
- No KVM or container path; bare metal only.
- No image build or registration.
- No floating IP association step, despite the IP being reserved.
- The benchmark workload itself is outside the extracted provisioning surface.
