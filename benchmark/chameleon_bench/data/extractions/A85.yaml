summary: 'The artifact for a USENIX FAST 2025 paper on Silhouette, which leverages consistency mechanisms
  to find bugs in persistent-memory file systems. Offers two evaluation routes, Chameleon Trovi being
  the recommended one. Provisioning uses the current object-oriented surface with every parameter bound
  to a variable rather than a literal: site, lease name and duration are all supplied from configuration,
  which makes it the most parameterised artifact in this corpus. Both the lease and the server are submitted
  with a widget display, so progress renders interactively in the notebook rather than as printed lines.'
