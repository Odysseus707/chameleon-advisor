preconditions:
- Assumes configuration variables for the lease location, name and duration are defined before the provisioning
  cells.
- Assumes an available-node list has been populated by an earlier cell the extraction does not capture.
- Assumes a project is selectable interactively; choose_project is called with no arguments.
- Assumes persistent-memory hardware is reachable, which the reserved node type does not by itself guarantee.
traps_illustrated:
- Every provisioning parameter is a variable, so the artifact's own cells do not record which site, name
  or duration it actually used.
- Submission uses a widget display, which is friendly in a live notebook and produces nothing useful in
  a headless re-run.
- The node is reserved by host object rather than node type, so the notebook depends on an earlier cell.
- The auth cell's comment explains that opting into the new interface is necessary or the functional calls
  return old types, which is the clearest statement of the two-generation problem in this corpus.
