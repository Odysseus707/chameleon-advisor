summary: A reproduction of a specific Apache Hadoop YARN bug, in which the set of nodes an application
  ran on is not cleared on final transition. Provisions one CPU node plus a floating IP at CHI@TACC for
  six hours using the legacy imperative surface, then launches an Ubuntu server against the node reservation.
  The server name embeds both the bug identifier and a unix timestamp, so each run is distinct and the
  resource itself records which issue it belongs to.
