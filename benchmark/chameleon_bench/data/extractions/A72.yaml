preconditions:
- Assumes the hardcoded project id matches the reader's own project.
- Assumes the USER environment variable is set, since it prefixes the server name.
- Assumes keystoneauth1 and blazarclient are importable, since the lease cell imports both.
- Assumes the composable-hardware node type is free at CHI@UC for an immediate six-hour window.
traps_illustrated:
- The node type is a composable-hardware class rather than a general CPU node, so the reservation competes
  for scarce hardware that the artifact never explains needing.
- A timestamp is captured in both the lease cell and the server cell but used in neither name, so the
  intent to make names unique was dropped halfway.
- The project id is hardcoded rather than read from the environment.
- reservation_id is obtained from lease.get_node_reservation on the lease id, not from the lease id itself.
- A floating IP is added to the same reservations list as the node, with no association step.
not_covered:
- No teardown in the extracted cells.
- No KVM or container path; bare metal only.
- No image build; a published image is bound to a variable.
- No real NVMe hardware; the point of the artifact is emulation.
