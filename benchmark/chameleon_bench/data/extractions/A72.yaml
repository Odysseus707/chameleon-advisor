summary: 'A reproduction of FEMU, an accurate NVMe solid-state drive emulator, benchmarked with FIO on
  Chameleon bare metal at CHI@UC. Provisioning is legacy-era: a floating IP and one node reserved for
  six hours, then a server launched against the node reservation. Notably the node type reserved is a
  composable-hardware type rather than a general CPU node, which is one of the scarcer classes on the
  testbed and is not what a reader would guess from a storage-emulation artifact.'
workflow_stages:
- stage: site/auth
  verbatim_code: |-
    import chi

    chi.use_site("CHI@UC")

    project_id = "CHI-251412"
    chi.set("project_name", project_id)
  source_ref: main.ipynb cell 1
- stage: lease
  verbatim_code: |-
    from chi import lease, server
    import os
    import keystoneauth1, blazarclient
    import time

    reservations = []
    lease_node_type = "compute_gigaio"
    reservation_req_time = int(time.time())

    try:
        print("Creating lease...")
        lease.add_fip_reservation(reservations, count=1)
        lease.add_node_reservation(reservations, node_type=lease_node_type, count=1)

        start_date, end_date = lease.lease_duration(hours=6)

        l = lease.create_lease(
            f"{os.getenv('USER')}-femu-reproduced",
            reservations,
            start_date=start_date,
            end_date=end_date
        )
        lease_id = l["id"]
        print("Waiting for lease to start ...")
        lease.wait_for_active(lease_id)
        print("Lease is now active!")
    except:
        pass
  source_ref: main.ipynb cell 2
- stage: server
  verbatim_code: |-
    from chi import server

    image = "CC-Ubuntu20.04"
    reservation_req_time = int(time.time())

    s = server.create_server(
       f"{os.getenv('USER')}-femu-reproduced",
       image_name=image,
       reservation_id=lease.get_node_reservation(lease_id)
    )

    print("Waiting for server to start ...")
    server.wait_for_active(s.id)
    print("Done")
  source_ref: main.ipynb cell 3
