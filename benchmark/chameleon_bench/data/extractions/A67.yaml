preconditions:
- Assumes SITE, PROJECT_NAME and LEASE_NAME constants are defined by earlier cells.
- Assumes a keypair exists under the configured name, since the server call passes one.
- Assumes a project network id has been resolved before the server cell.
- Assumes the requested CPU node type is free, since the lease is created for an immediate window when
  none is found.
traps_illustrated:
- Modules are loaded through importlib rather than imported directly, which defeats static analysis and
  is why the extraction records no api_family.
- The lease search is wrapped in a bare except that prints and continues, so an authentication failure
  reads as no lease found and the notebook proceeds to create a duplicate.
- Get-then-create is used for both the lease and the server, which makes the notebook re-runnable but
  hides whether anything was actually created.
- The reproduction is explicitly a scaled subset, so its results are not comparable to the paper's without
  saying so.
