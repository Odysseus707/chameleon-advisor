preconditions:
- Assumes a PROJECT_ID variable is defined before the lease cell, since it prefixes the lease name.
- Assumes a LEASE_HOURS variable is defined, since it supplies the lease duration.
- Assumes a project is selectable interactively; choose_project is called with no arguments.
- Assumes the requested flavor is available at the virtual-machine site.
traps_illustrated:
- The notebook selects one site and then re-selects a different one partway through, so any resource created
  between the two calls lands somewhere the reader may not expect.
- The reservation is a flavor reservation by id from a name lookup, not a bare-metal node reservation,
  despite the first site selection naming a bare-metal site.
- Submission is idempotent, so re-running reuses an existing lease.
- Persistent data implies storage that outlives the lease, which nothing in the extracted provisioning
  creates or deletes.
