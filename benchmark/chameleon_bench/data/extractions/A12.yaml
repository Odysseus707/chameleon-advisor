traps_illustrated:
- submit(idempotent=True) makes re-running the reservation cell safe rather than creating a duplicate
  lease.
- Downstream cells call lease.get_lease with the same f-string name instead of reserving again, so the
  lease name is load-bearing.
- The node reservation uses amount= rather than count=, which is the current-API spelling.
- A floating IP is reserved in the same lease as the node, before submit.
- start_date is passed explicitly, so the lease need not begin immediately.
