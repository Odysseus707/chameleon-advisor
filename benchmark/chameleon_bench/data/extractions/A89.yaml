preconditions:
- Assumes the USER environment variable is set, since it prefixes the lease name.
- Assumes a NODE_TYPE variable is defined before the lease cell.
- Assumes a site and project are selectable interactively; both are chosen with no arguments.
- Assumes the requested node type is free, because submission blocks until the lease is active.
traps_illustrated:
- Submission waits for the lease to become active, so an unavailable node type produces a long block rather
  than an immediate answer.
- The lease name contains a double hyphen from an f-string joining a prefix that already ends in one.
- The node type is a composable-hardware class, which is among the scarcer resources on the testbed.
- Four hours is a short window for an inference benchmarking campaign.
- Submission is idempotent, so re-running reuses an existing lease.
