preconditions:
- Assumes the USER environment variable is set, since it prefixes every resource name after underscore
  sanitisation.
- Assumes instance_count and node_type variables are defined before the lease cell, since both are passed
  to the reservation.
- Assumes a network_name variable is defined, since the storage network reservation takes it.
- Assumes enough nodes of the requested type are free for a full-day window, because the count is a variable
  and may exceed what is available.
traps_illustrated:
- Underscores are stripped from the username before it is used in resource names, which is a real Chameleon
  naming constraint and silently corrupts names if forgotten.
- A storage network reservation is required for NFS shares and is easy to omit, because nothing fails
  until the shares are mounted.
- The node reservation takes an amount, so a multi-node request either succeeds wholly or waits, unlike
  the single-node reservations elsewhere in this corpus.
- The bare-metal, CUDA and virtual-machine notebooks differ only in a few lines, so a fix applied to one
  silently misses the others.
- use_site is called directly rather than choose_site with a default, so the site is fixed in code rather
  than confirmed interactively.
not_covered:
- No teardown in the extracted lease cells.
- No image build; the appliance ships prebuilt HPC images.
- No server launch in the extracted cells, though the appliance provisions nodes.
- No accelerator-specific reservation; the CUDA variant differs only in the lease name.
