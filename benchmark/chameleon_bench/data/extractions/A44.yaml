summary: 'A published Chameleon appliance providing a ready-to-use HPC cluster built on MPI and Spack,
  with automated node setup for immediate execution of MPI applications. This is the bare-metal variant:
  it reserves a configurable number of nodes by node type for a full day, and uniquely in this corpus
  it also reserves a storage network, which the comment explains is required to use NFS shares. The repository
  ships parallel notebooks for a plain bare-metal cluster, a CUDA cluster and a virtual-machine cluster,
  so one artifact exercises both the node and flavor reservation grammars. Usernames are sanitised by
  replacing underscores, because resource names cannot contain them.'
