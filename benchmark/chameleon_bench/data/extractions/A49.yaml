preconditions:
- Assumes a Chameleon keypair exists under the name given in the configuration cell, and that its private
  key file is present locally.
- Assumes the shared network named in the configuration provides internet access, which the comment asserts.
- Assumes the requested GPU node type is free at CHI@UC for a one-day window beginning a minute from now.
- Assumes the artifact is run at the pinned commit, which the README warns may differ from the repository
  head.
traps_illustrated:
- The lease start is deliberately set one minute in the future rather than now, to allow for request processing,
  which is a real Blazar behaviour most artifacts here ignore.
- Timestamps are formatted to an explicit Blazar time format string rather than passed as datetimes.
- The keypair name and key file are hardcoded placeholders the reader must change together, and a mismatch
  fails only at SSH time.
- Cleanup is present but sits at the end of a long notebook, so an abandoned run still leaks the lease.
- The node type is a GPU type while the configuration comment describes only the CPU, which is easy to
  misread as a CPU-only node.
