summary: 'A reproduction of BP-tree results from a VLDB 2024 artifact, run on Chameleon bare metal at
  CHI@TACC. Provisioning is legacy-era and re-runnable: both the lease and the server are fetched by name
  inside try blocks and created only when absent, and a later cell reads a reserved floating IP off the
  lease object and associates it with the server. The lease key is a fixed literal rather than a per-user
  name, which is unusual here and means two people in one project collide. The README is explicit that
  the repository modifies the original for reproduction and that implementation credit belongs to the
  upstream authors.'
