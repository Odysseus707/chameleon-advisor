preconditions:
- Assumes the hardcoded project name matches the reader's own project.
- Assumes keystoneauth1 and blazarclient are importable, since the lease cell imports both.
- Assumes the requested CPU node type is free at CHI@TACC for a six-hour window.
- Assumes a floating IP was reserved with the lease, since a later cell reads one off the lease object.
traps_illustrated:
- The lease key is a fixed literal with no username in it, so two members of one project reserving concurrently
  collide on the name.
- Get-then-create is used for both lease and server, wrapped in bare excepts that treat any failure as
  absence.
- The same key names the lease and the server, coupling their lifetimes without any code enforcing it.
- The floating IP is associated in a later cell, which most artifacts in this corpus reserve and never
  perform.
- The lease module is imported twice in the same cell.
