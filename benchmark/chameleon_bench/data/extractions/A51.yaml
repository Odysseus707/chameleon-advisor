summary: A teaching tutorial on online evaluation of machine learning systems, the second of a three-part
  series that runs from offline evaluation through to closing the feedback loop. Runs on virtual machines
  at the KVM site, reserving a flavor by id from a name lookup for a six-hour lease using the current
  context and Lease objects. Unlike most artifacts in this corpus it ships a real teardown notebook that
  deletes both the server and the lease, and a separate notebook that prepares security groups. Every
  provisioning cell states in a comment that it runs in the Chameleon Jupyter environment.
