preconditions:
- Assumes the notebooks run from the Chameleon Jupyter environment, which every provisioning cell states
  in a comment.
- Assumes the USER environment variable is set, since every resource name is prefixed with it.
- Assumes a project is selectable interactively; choose_project is called with no arguments.
- Assumes the requested flavor is available at the virtual-machine site for the six-hour window.
traps_illustrated:
- The reservation is a flavor reservation by id from a name lookup, a different grammar from the bare-metal
  node reservation used elsewhere in this corpus.
- The create and delete notebooks both interpolate the username independently, so a mismatch silently
  fails to find the resource to delete.
- Security group setup lives in its own notebook outside the provisioning path, so it is easy to skip.
- Lease submission is idempotent, so a second run reuses an existing lease rather than raising.
not_covered:
- No bare-metal path.
- No GPU or accelerator use.
- No image build; a published image is used.
- No cross-part orchestration; the other two parts of the series are separate repositories.
