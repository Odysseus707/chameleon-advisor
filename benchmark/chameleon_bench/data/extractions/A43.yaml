summary: 'The Chameleon HPC appliance family: MPI and Spack clusters published as prebuilt images, with
  four parallel notebooks covering a plain bare-metal build, a CUDA build, a ROCm build, and a KVM build.
  Each pins its site directly with context.use_site rather than prompting, and reserves a multi-node cluster
  for one day. The bare-metal variants additionally reserve a storage-usage network, which is what makes
  NFS shares available across the cluster - the only artifact in this corpus to use a network reservation.
  The KVM variant instead reserves a flavor by id.'
