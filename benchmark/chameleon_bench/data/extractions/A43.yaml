preconditions:
- Assumes instance_count, node_type and network_name are defined in an earlier configuration cell.
- Assumes the USER environment variable is set; underscores are rewritten to hyphens because resource
  names cannot contain them.
- Assumes the reader opens the notebook matching their accelerator, since the four variants target different
  hardware and images.
- Assumes the corresponding prebuilt HPC image is available at the chosen site.
traps_illustrated:
- A storage-usage network must be reserved in the same lease for NFS shares to work; omitting it leaves
  a cluster that cannot share a filesystem.
- Four variants differ by site and accelerator, and each pins its site with a direct use_site call, so
  opening the wrong notebook silently targets different hardware.
- The KVM variant uses add_flavor_reservation with a flavor id while the bare-metal variants use add_node_reservation
  with a node type - the same task in two grammars.
- Underscores in the username are replaced with hyphens before being used in resource names.
- Node count is passed as amount= on the node reservation, so a cluster is one reservation rather than
  many.
- Leases are measured in days, matching the intended multi-node HPC session length.
not_covered:
- No teardown of the lease or any server in the extracted cells.
- No image is passed as a call kwarg, although three named appliance images exist for this artifact.
- No floating IP reservation in the KVM variant, unlike the bare-metal ones.
- No Spack package configuration is shown as Chameleon provisioning; it belongs to the image.
