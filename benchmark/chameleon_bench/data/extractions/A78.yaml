traps_illustrated:
- The lease start is deliberately set one minute in the future rather than now, to allow for request processing.
- Deletion is polled to completion with a timeout rather than fired and forgotten, which is the only artifact
  here that confirms teardown actually happened.
- The keypair name and key file are hardcoded placeholders the reader must change together, and a mismatch
  fails only at SSH time.
- The configuration comment describes the CPU model, which is easy to read as the whole hardware spec.
- The notebook filename contains a typo, which matters because the README tells the reader to open it
