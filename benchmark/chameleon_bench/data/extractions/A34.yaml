preconditions:
- Assumes the notebooks run from the Chameleon Jupyter environment, which several provisioning cells state
  in a comment.
- Assumes leases already exist under fixed project-specific names; the GPU notebook calls get_lease rather
  than creating one.
- Assumes a project is selectable interactively; every notebook calls choose_project with no arguments.
- Assumes the reader runs the notebooks in lifecycle order, since later stages consume servers created
  by earlier ones.
traps_illustrated:
- The lease is fetched by a hardcoded project-specific name, so the notebook fails for anyone who has
  not created that exact lease.
- The artifact spans both the bare-metal and virtual-machine reservation grammars across different notebooks,
  so no single provisioning pattern describes it.
- Each stage re-selects site and project independently, so a partially run lifecycle can end up split
  across two sites.
- A delete notebook exists for the data pipeline VM but not for the GPU training node.
