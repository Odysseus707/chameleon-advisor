summary: 'Reproduction of Fairify, a tool for fairness verification of neural networks published at ICSE
  2023, run on Chameleon bare metal. The Chameleon provisioning is the standard bare-metal experiment
  pattern copied essentially verbatim: current context API, a three-hour Lease taking a node from a prior
  availability query plus a floating IP, then a Server against that reservation using a published Ubuntu
  image. Two notebooks carry identical provisioning blocks, differing only in what they run afterwards.'
