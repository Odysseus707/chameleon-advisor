preconditions:
- Assumes context.version = "1.0" is set before other python-chi calls.
- Assumes available_nodes was populated by an earlier query cell, since the reservation indexes into it.
- Assumes the USER environment variable is set, as it prefixes every resource name.
- Assumes a node is free at the chosen site, because the lease starts immediately.
traps_illustrated:
- The lease is named after power management even though the experiment verifies neural network fairness
  - the provisioning scaffolding was reused unchanged from the bare metal experiment pattern.
- reservation_id is threaded from my_lease.node_reservations[0]["id"] into Server, not from the lease
  id.
- The node is taken as available_nodes[0] rather than by node_type, so which hardware is reserved depends
  on a prior query.
- submit(idempotent=True) on both Lease and Server makes re-running safe.
- A floating IP is reserved in the same lease as the node.
