preconditions:
- Assumes an SSH key has already been added at both the virtual-machine and the bare-metal site, which
  the README states explicitly.
- Assumes the notebooks run from the Chameleon Jupyter environment, which every provisioning cell states
  in a comment.
- Assumes the USER environment variable is set, since every resource name is prefixed with it.
- Assumes the reader runs the notebooks in order, because later ones fetch the lease created by the first.
traps_illustrated:
- The server's flavor is read from the lease's reserved flavors rather than restated, which is the pattern
  that keeps a server from being launched on hardware the lease did not reserve.
- Later notebooks fetch the lease by name rather than creating one, so running them out of order fails
  on a missing lease.
- One comment calls the username a prefix and another calls it a suffix within the same lab.
- The lab spans both reservation grammars and both sites, so a reader who selects the wrong site loses
  the resources created earlier.
- Block and object parts are independent, so the shared setup is not actually shared.
not_covered:
- No GPU or accelerator use.
- No image build; a published image is used.
- No teardown covering both halves of the lab.
- No bare-metal node reservation in the extracted block-storage cells, despite bare-metal sites being
  listed.
