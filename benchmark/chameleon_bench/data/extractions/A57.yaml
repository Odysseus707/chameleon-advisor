summary: 'A teaching lab on persistent storage on Chameleon, split into two independent parts: block storage
  providing a persistent filesystem for a virtual machine, and object storage for persisting training
  data and benchmarking training input pipelines. Spans several notebooks across both the virtual-machine
  and bare-metal sites. The most instructive detail for provisioning is that the server is created with
  a flavor name read back off the lease''s own reserved flavors rather than named again, which keeps the
  server and the reservation from drifting apart. The README states that SSH keys must already be added
  at two named sites before starting.'
