preconditions:
- Assumes site_name, project_name, node_type, image_name and network_name are set in an earlier configuration
  cell.
- Assumes the requested node_type is free, because the lease starts immediately.
- Assumes the named network exists at the site, since create_server takes an explicit network_id.
- Assumes the user runs the notebooks in order, as the server cell depends on the lease created earlier.
traps_illustrated:
- Teardown is present but guarded by do_teardown = False, so running the notebook end to end leaves the
  lease active and consuming allocation.
- create_server is given a network_id resolved via chi.network.get_network_id, not left to a default.
- The node reservation is retrieved with chi.lease.get_node_reservation(lease['id'], node_type=..., count=1)
  rather than by index.
- A floating IP is reserved in the same lease so the Jupyter server is reachable from outside.
