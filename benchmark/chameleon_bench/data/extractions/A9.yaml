summary: Artifact for Baleen (FAST 2024), which applies machine-learned admission and prefetching policies
  to flash caches. The Chameleon portion provisions a dedicated bare-metal node to run a Jupyter server
  for the reproduction. Uses the legacy imperative python-chi surface (chi.use_site, chi.set, chi.lease.*,
  chi.server.*), reserving one node by node_type plus a floating IP, then creating a server bound to both
  that node reservation and an explicitly looked-up network id. A teardown cell exists but is disabled
  by default.
workflow_stages:
- stage: site/auth
  verbatim_code: |-
    import chi

    chi.use_site(site_name)
    chi.set("project_name", project_name)
  source_ref: chameleon/2-start-dedicated-server.ipynb cell 2
- stage: lease
  verbatim_code: |-
    import chi.lease

    # Reserve a host for the Jupyter server
    reservation = []
    chi.lease.add_node_reservation(
        reservation,
        node_type=node_type,
        count=1
    )
    # We need to use a floating IP
    # in order to access the Jupyter server from the computer you're using
    chi.lease.add_fip_reservation(reservation, count=1)

    start_date, end_date = chi.lease.lease_duration(days=lease_length)

    # Create the lease on Chameleon
    print("Submitting lease...")
    lease = chi.lease.create_lease(
        lease_name,
        reservation,
        start_date=start_date,
        end_date=end_date
    )
    print("Waiting for lease to become active...")
    lease = chi.lease.wait_for_active(lease["id"])
    print("Lease is active!")
    lease
  source_ref: chameleon/2-start-dedicated-server.ipynb cell 3
- stage: server
  verbatim_code: |-
    import chi.network
    import chi.server

    network_id = chi.network.get_network_id(network_name)
    server_name = f"{user}-jupyter-notebook-server"
    node_reservation = chi.lease.get_node_reservation(
        lease["id"],
        node_type=node_type,
        count=1,
    )
    print(f"Spawning server at {site_name}...")
    notebook_server = chi.server.create_server(
        server_name,
        reservation_id=node_reservation,
        image_name=image_name,
        network_id=network_id,
        count=1,
    )
    print("Waiting for server to become active...")
    chi.server.wait_for_active(notebook_server.id)
    print(f"Server at {site_name} is active!")
  source_ref: chameleon/2-start-dedicated-server.ipynb cell 4
- stage: teardown
  verbatim_code: |-
    do_teardown = False

    if do_teardown:
        chi.lease.delete_lease(lease["id"])
  source_ref: chameleon/2-start-dedicated-server.ipynb cell 17
