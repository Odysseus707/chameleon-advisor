preconditions:
- Assumes my_flavor was resolved in an earlier cell, since the reservation passes its name.
- Assumes the USER environment variable is set, as it prefixes both the lease and the instance name.
- Assumes a GPU flavor is available on the KVM cloud at reservation time.
- Assumes the CUDA image named on the Server exists at the site.
traps_illustrated:
- The flavor is reserved by name and then read back with get_reserved_flavors().pop(), so the Server is
  built from the reservation rather than from the originally requested flavor.
- This is the KVM grammar - add_flavor_reservation - not the bare-metal add_node_reservation, even though
  the workload is GPU compute.
- The site is pinned with use_site rather than choose_site, so no prompt appears and the site cannot be
  changed interactively.
- The image is named explicitly on the Server as a CUDA image, which must match the reserved GPU flavor.
- Lease and instance carry different name suffixes derived from the same username, so both must be cleaned
  up separately.
not_covered:
- No bare-metal node reservation; this is deliberately the virtual-machine GPU path.
- No teardown in the extracted cells.
- No multi-instance or cluster configuration.
- The persistent volume step is described as optional and is not part of the core reservation flow.
