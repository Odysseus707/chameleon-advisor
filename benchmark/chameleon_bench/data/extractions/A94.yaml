summary: 'The canonical example of using a GPU on the Chameleon KVM cloud: reserve a GPU flavor, launch
  an instance with it, configure networking and security groups, demonstrate the GPU, and optionally attach
  a persistent volume. Uses the current object API with the KVM grammar, and reserves the flavor by NAME
  rather than by id, then reads the reservation back with get_reserved_flavors before naming it on the
  Server. The site is pinned directly with context.use_site rather than prompted for.'
workflow_stages:
- stage: site/auth
  verbatim_code: |-
    from chi import context

    context.use_site("KVM@TACC")
    context.choose_project()
  source_ref: gpu_instance.ipynb cell 1
- stage: lease
  verbatim_code: |-
    from chi import lease
    from datetime import timedelta
    import os

    my_lease = lease.Lease(f"{os.getenv('USER')}-gpu-lease", duration=timedelta(hours=2))
    my_lease.add_flavor_reservation(name=my_flavor.name, amount=1)
    my_lease.submit(idempotent=True)
  source_ref: gpu_instance.ipynb cell 3
- stage: server
  verbatim_code: |-
    from chi import server

    reserved_flavor = my_lease.get_reserved_flavors().pop()

    my_server = server.Server(
        f"{os.getenv('USER')}-gpu-instance",
        flavor_name=reserved_flavor.name,
        image_name="CC-Ubuntu24.04-CUDA",
    )
    my_server.submit(idempotent=True)
  source_ref: gpu_instance.ipynb cell 4
- stage: lease
  verbatim_code: |-
    from chi import network

    existing_groups = network.list_security_groups(name_filter="ssh")
    if existing_groups:
        sg = existing_groups.pop()
        print(f"Using existing SSH security group - '{sg.name}'")
    else:
        print("Creating new SSH group 'Allow SSH'")
        sg = network.SecurityGroup({"name": "Allow SSH", "description": "Allow incoming SSH connections"})
        sg.add_rule("ingress", "tcp", 22)
        sg.submit()

    my_server.add_security_group(sg.id)
  source_ref: gpu_instance.ipynb cell 6
- stage: lease
  verbatim_code: |-
    from chi import storage

    v = storage.Volume(f"{os.getenv('USER')}-gpu-volume-2", 1)  # 1 GB in size.
    v.submit(idempotent=True)
  source_ref: gpu_instance.ipynb cell 9
