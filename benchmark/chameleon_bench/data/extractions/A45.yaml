summary: The virtual-machine variant of a published Chameleon appliance providing a ready-to-use HPC cluster
  built on MPI and Spack, with automated node setup for immediate execution of MPI applications. Where
  the bare-metal variant reserves nodes by type and a storage network for NFS, this one reserves a flavor
  by id for the same configurable instance count and needs no network reservation. The repository ships
  all variants side by side, so the same artifact family covers both reservation grammars. Usernames are
  sanitised by replacing underscores, because resource names cannot contain them.
