preconditions:
- Assumes the USER environment variable is set, since it prefixes every resource name after underscore
  sanitisation.
- Assumes instance_count and a flavor object are defined before the lease cell, since both are passed
  to the reservation.
- Assumes a project is selectable interactively; choose_project is called with no arguments.
- Assumes enough instances of the requested flavor are available for a full-day window.
traps_illustrated:
- The flavor is passed as an object attribute rather than looked up by name in the call, so the reader
  must trace where the flavor came from.
- Underscores are stripped from the username before it is used in resource names, which is a real Chameleon
  naming constraint.
- The virtual-machine notebook shares a lease name with the plain bare-metal notebook, so running both
  in one project collides.
- No storage network is reserved here, so an NFS setup copied from the bare-metal variant will not work
  unchanged.
not_covered:
- No node reservation; this variant is flavor-based throughout.
- No storage network reservation, unlike its bare-metal sibling.
- No teardown in the extracted lease cells.
- No image build; the appliance ships prebuilt HPC images.
memorization_probes:
- mpi_lease.add_flavor_reservation(id=flavor.id, amount=instance_count)
- context.use_site("KVM@TACC")
- username = os.environ.get('USER').replace("_", "-")
