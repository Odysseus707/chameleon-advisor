summary: 'Teaching lab that builds a small data platform for a hypothetical GourmetGram service on the
  KVM cloud: PostgreSQL for application data, RedPanda for real-time events, Iceberg tables materialized
  by Airflow, and a moderation model trained from Iceberg snapshots. Provisioning is the KVM grammar rather
  than bare metal: a Lease reserves a flavor, resolved by name through chi.server.get_flavor_id, rather
  than a node type. Unusually for this corpus it ships an explicit teardown notebook that fetches the
  lease by name and deletes it.'
