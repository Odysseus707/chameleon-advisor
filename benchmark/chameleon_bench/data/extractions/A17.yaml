preconditions:
- Assumes a Chameleon account added to a project with an SSH key registered for the KVM site.
- Assumes context.version = "1.0" is set before other python-chi calls.
- Assumes the USER environment variable is set, since it prefixes every resource name.
- Assumes the named flavor exists at the site, because it is resolved by name at reservation time.
traps_illustrated:
- 'KVM grammar: add_flavor_reservation with an id resolved by chi.server.get_flavor_id, not add_node_reservation
  with a node type.'
- The flavor is looked up by name at run time, so a renamed or unavailable flavor fails at reservation
  rather than at submit.
- submit(idempotent=True) makes the reservation cell safe to re-run.
- Teardown is a separate notebook that re-establishes context first, so deleting requires the same site
  selection as creating.
- The lease is deleted by l.id after being fetched by name, not by the name itself.
