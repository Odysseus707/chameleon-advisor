summary: 'UCARE-MinIO, a quickstart for running MinIO object storage on a Kubernetes cluster over Chameleon
  bare metal. Uses the legacy imperative python-chi surface throughout: chi.set carries not just the project
  but also the image and keypair as global settings, and the reservation is built by mutating a list before
  create_lease. Distinctively for this corpus it reserves for a full week and then reads back the reserved
  floating IP from the lease, rather than associating one later.'
workflow_stages:
- stage: site/auth
  verbatim_code: |-
    import chi

    chi.use_site("CHI@UC")
    chi.set("project_name", "<insert projects code, such as CH-XXXXXX")
    chi.set("image", "CC-CentOS7")
    chi.set("keypair_name", "<insert keypair name>")
  source_ref: UCARE-MinIO-Quickstart-K8.ipynb cell 1
- stage: lease
  verbatim_code: |-
    from chi import lease

    res = []
    lease.add_node_reservation(res, node_type="compute_skylake", count=1)
    lease.add_fip_reservation(res, count=1)
    start_date, end_date = lease.lease_duration(days=7)

    l = lease.create_lease("minio-k8", res, start_date=start_date, end_date=end_date)

    print("Waiting for lease to start ...")

    l = lease.wait_for_active(l["id"])

    print("Lease started!")

    reserved_fips = lease.get_reserved_floating_ips(l["id"])
    print("ip =",reserved_fips[0])
  source_ref: UCARE-MinIO-Quickstart-K8.ipynb cell 2
- stage: server
  verbatim_code: |-
    from chi import server
    reservation_id = ""
    for item in l["reservations"]:
        if item["resource_type"] == "physical:host":
            reservation_id = item["id"]

    instance = server.create_server(
        "minio-k8-instance",
        reservation_id=reservation_id,
        image_name=chi.get("image")
    )

    print("Creating instance...")
    chi.server.wait_for_active(instance.id, timeout=1200)

    print("Associating floating ip")
    ip = server.associate_floating_ip(instance.id, reserved_fips[0])

    server.wait_for_tcp(ip, port=22)
    print("Done! IP=", ip)
  source_ref: UCARE-MinIO-Quickstart-K8.ipynb cell 3
