preconditions:
- Assumes the reader replaces the placeholder project code and keypair name before running anything.
- Assumes the named node type is free at the site, because the lease starts immediately.
- Assumes a week-long reservation is within the project's allocation.
- Assumes the CentOS image set through chi.set is available at the site.
traps_illustrated:
- Project code and keypair are literal placeholders, so an unedited run fails immediately.
- chi.set is used to carry the image and keypair as global state rather than passing them per call, which
  is the legacy idiom.
- The lease is created for seven days, an order of magnitude longer than most artifacts in this corpus.
- The reserved floating IP is read back with get_reserved_floating_ips and indexed, rather than associated
  to the server afterwards.
- A node type literal is passed directly to add_node_reservation, so the hardware choice is explicit rather
  than inherited from a query.
not_covered:
- No teardown of the lease or the server.
- No KVM or container path at the Chameleon layer; Kubernetes runs on top of bare metal.
- No use of the current context API; this is entirely the legacy surface.
- No floating IP association call, only retrieval of the reserved address.
