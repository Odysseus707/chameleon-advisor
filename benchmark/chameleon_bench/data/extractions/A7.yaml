preconditions:
- Assumes a Chameleon account whose project name matches the hardcoded value passed to chi.set.
- Assumes compute_cascadelake_r nodes are free at CHI@UC, because the lease starts immediately.
- Assumes python-chi, keystoneauth1 and blazarclient are importable in the notebook kernel.
- Assumes the CC-Ubuntu22.04 image is available at the selected site.
traps_illustrated:
- The project name is hardcoded into chi.set rather than read from the environment, so the notebook fails
  for any other project.
- A floating IP is reserved in the same lease as the node, via add_fip_reservation on the shared reservations
  list before create_lease.
- reservation_id is obtained from lease.get_node_reservation(lease_id), not from the raw lease id.
- Failure to reserve is caught separately from an authorization failure, and the handler points the user
  at the host calendar rather than retrying blindly.
- 'Legacy-era API: lease.create_lease with an explicit start_date/end_date pair from lease.lease_duration,
  rather than the current Lease object.'
not_covered:
- No teardown - neither the lease nor the server is deleted anywhere in the notebook.
- No KVM or container path; bare metal only.
- No image building or registration; a published CC image is used.
- No floating IP association step, despite the IP being reserved.
