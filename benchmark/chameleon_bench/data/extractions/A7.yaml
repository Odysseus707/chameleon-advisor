summary: Reproduction of the Acto push-button end-to-end testing tool for Kubernetes operators, provisioned
  on Chameleon bare metal. Uses the legacy imperative python-chi surface throughout (chi.use_site, chi.set,
  lease.add_node_reservation, server.create_server) rather than the current context/Lease/Server objects.
  Reserves one compute_cascadelake_r node plus a floating IP in a single 3-hour lease at CHI@UC, then
  launches a CC-Ubuntu22.04 server against that node reservation. Wraps lease creation in explicit exception
  handling that distinguishes an authorization failure from an unavailable node type.
workflow_stages:
- stage: site/auth
  verbatim_code: |-
    import chi

    chi.use_site("CHI@UC")
    chi.set("project_name", "CHI-231080")

    print(f'Using Project {chi.get("project_name")}')
  source_ref: setup.ipynb cell 1
- stage: lease
  verbatim_code: |-
    import os
    import keystoneauth1, blazarclient
    from chi import lease

    reservations = []
    lease_node_type = "compute_cascadelake_r"

    try:
        print("Creating lease...")
        lease.add_fip_reservation(reservations, count=1)
        lease.add_node_reservation(reservations, node_type=lease_node_type, count=1)

        start_date, end_date = lease.lease_duration(hours=3)

        l = lease.create_lease(
            f"{os.getenv('USER')}-power-management",
            reservations,
            start_date=start_date,
            end_date=end_date
        )
        lease_id = l["id"]

        print("Waiting for lease to start ...")
        lease.wait_for_active(lease_id)
        print("Lease is now active!")
    except keystoneauth1.exceptions.http.Unauthorized as e:
        print("Unauthorized.\nDid set your project name and and run the code in the first cell?")
    except blazarclient.exception.BlazarClientException as e:
        print(f"There is an issue making the reservation. Check the calendar to make sure a {lease_node_type} node is available.")
        print("https://chi.uc.chameleoncloud.org/project/leases/calendar/host/")
        print(e)
    except Exception as e:
        print("An unexpected error happened.")
        print(e)
  source_ref: setup.ipynb cell 3
- stage: server
  verbatim_code: |-
    from chi import server, lease

    image = "CC-Ubuntu22.04"

    s = server.create_server(
        f"{os.getenv('USER')}-power-management",
        image_name=image,
        reservation_id=lease.get_node_reservation(lease_id)
    )

    print("Waiting for server to start ...")
    server.wait_for_active(s.id)
    print("Done")
  source_ref: setup.ipynb cell 4
