preconditions:
- Assumes the notebooks run from the Chameleon Jupyter environment, which the provisioning cells state
  in a comment.
- Assumes the USER environment variable is set, since resource names are prefixed with it.
- Assumes a project is selectable interactively; choose_project is called with no arguments.
- Assumes the requested flavor is available at the virtual-machine site for the six-hour window.
traps_illustrated:
- The reservation is a flavor reservation, a different grammar from the bare-metal node reservation used
  elsewhere in this corpus.
- Each notebook re-selects site and project independently, so a partially run series can straddle sites.
- The tutorial is one of three parts held in separate repositories, so the reader must move between artifacts
  to complete it.
- Resource names are interpolated from the environment, so a mismatch between the create and delete notebooks
  silently fails to find the resource.
not_covered:
- No bare-metal path.
- No GPU or accelerator use.
- No image build; a published image is used.
- No cross-part orchestration; the other two parts are separate repositories.
