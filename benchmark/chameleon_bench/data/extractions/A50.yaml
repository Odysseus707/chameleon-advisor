summary: A teaching tutorial on offline evaluation of machine learning systems, the first of a three-part
  series that continues into online evaluation and closing the feedback loop. Runs on virtual machines
  at the KVM site, reserving a flavor for a six-hour lease using the current context and Lease objects,
  and is written to be driven from the Chameleon Jupyter environment. The extracted provisioning spans
  several notebooks that each re-select site and project, and includes a server stage as well as the lease.
