summary: 'Reproduction of Compressor, which compresses pre-trained models of code down to a few megabytes,
  run on a Chameleon GPU node. Uses the legacy imperative python-chi surface: chi.use_site with a site
  constant, chi.set to pin the project id, then a reservations list built up with add_fip_reservation
  and add_node_reservation before create_lease. The site and project are assigned to module-level constants
  at the top of the notebook, which is the edit point a reader must change.'
