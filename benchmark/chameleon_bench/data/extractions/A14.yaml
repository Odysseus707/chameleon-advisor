- stage: site/auth
  verbatim_code: |-
    import chi

    CLOUD_SITE = "CHI@UC"
    PROJECT_ID = "CHI-251412" # Insert Project ID

    chi.use_site(CLOUD_SITE)

    # Change to your project (CHI-XXXXXX)
    chi.set("project_name", PROJECT_ID)
  source_ref: Compressor.ipynb cell 2
- stage: lease
  verbatim_code: |-
    from chi import lease

    reservations = []
    lease_node_type = "gpu_rtx_6000"

    try:
        print("Creating lease...")
        lease.add_fip_reservation(reservations, count=1)
        lease.add_node_reservation(reservations, node_type=lease_node_type, count=1)

        start_date, end_date = lease.lease_duration(days=0, hours=2)

        l = lease.create_lease(
            f"{os.getenv('USER')}-compressor",
            reservations,
            start_date=start_date,
            end_date=end_date
        )

        lease_id = l["id"]
        print("Waiting for lease to start ...")
        lease.wait_for_active(lease_id)
        print("Lease is now active!")

    except Exception as e:
        print(f"An error occurred: {e}")
  source_ref: Compressor.ipynb cell 3
- stage: server
  verbatim_code: |-
    from chi import server

    image = "CC-Ubuntu22.04-CUDA"

    s = server.create_server(
       f"{os.getenv('USER')}-compressor",
       image_name=image,
       reservation_id=lease.get_node_reservation(lease_id)
    )

    print("Waiting for server to start ...")
    server.wait_for_active(s.id)
    print("Done")
  source_ref: Compressor.ipynb cell 4
