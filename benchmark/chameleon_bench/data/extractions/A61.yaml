summary: A reproduction of the warm-starting neural network training paper, built as an interactive teaching
  notebook for the same summer of reproducibility fellowship as its sibling vision-transformer artifact
  and sharing its provisioning template. Provisions a GPU node plus a floating IP at CHI@UC using the
  legacy imperative surface, with a FUTURE-DATED lease starting sixteen hours out and running for a day.
  Every step carries a parenthetical instruction to the student, and the notebook ends with a teardown
  stage.
