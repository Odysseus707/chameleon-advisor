  # ============================================================
  # workspace/2_measure_pi.ipynb  (runs INSIDE the edge container — 5 code cells)
  # ============================================================
  - stage: exec
    source_ref: workspace/2_measure_pi.ipynb cell 1 (id cell-1)
    verbatim_code: |
      # runs in Jupyter container on edge device
      import os, time
      import numpy as np
      import onnxruntime as ort

  - stage: exec
    source_ref: workspace/2_measure_pi.ipynb cell 3 (id cell-3)
    verbatim_code: |
      # runs in Jupyter container on edge device
      def benchmark_session(ort_session):

          ## Benchmark inference latency for single sample

          num_trials = 100  # Number of trials
          input_shape = ort_session.get_inputs()[0].shape  # Get expected input shape
          input_dtype = np.float32  # Adjust dtype as needed
          fixed_shape = (1, *input_shape[1:])

          # Generate a single dummy sample with random values
          single_sample = np.random.rand(*fixed_shape).astype(input_dtype)

          # Warm-up run
          ort_session.run(None, {ort_session.get_inputs()[0].name: single_sample})

          latencies = []
          for _ in range(num_trials):
              start_time = time.time()
              _ = ort_session.run(None, {ort_session.get_inputs()[0].name: single_sample})
              latencies.append(time.time() - start_time)

          print(f"Inference Latency (single sample, median): {np.percentile(latencies, 50) * 1000:.2f} ms")
          print(f"Inference Latency (single sample, 95th percentile): {np.percentile(latencies, 95) * 1000:.2f} ms")
          print(f"Inference Latency (single sample, 99th percentile): {np.percentile(latencies, 99) * 1000:.2f} ms")
          print(f"Inference Throughput (single sample): {num_trials/np.sum(latencies):.2f} FPS")

  - stage: exec
    source_ref: workspace/2_measure_pi.ipynb cell 5 (id cell-5)
    verbatim_code: |
      # runs in Jupyter container on edge device
      onnx_model_path = "models/food11.onnx"
      ort_session = ort.InferenceSession(onnx_model_path, providers=['CPUExecutionProvider'])
      benchmark_session(ort_session)

  - stage: exec
    source_ref: workspace/2_measure_pi.ipynb cell 7 (id cell-7)
    verbatim_code: |
      # runs in Jupyter container on edge device
      onnx_model_path = "models/food11_quantized_dynamic.onnx"
      ort_session = ort.InferenceSession(onnx_model_path, providers=['CPUExecutionProvider'])
      benchmark_session(ort_session)

  - stage: exec
    source_ref: workspace/2_measure_pi.ipynb cell 9 (id cell-9)
    verbatim_code: |
