# api_generation note: python-chi usage is the object-oriented generation
# (context.version="1.0"; lease.get_lease() returns a Lease object; container.Container
# object with .submit()/.associate_floating_ip()/.execute()). It also uses two
# module-level helper functions (lease.get_lease(...) and chi.container.get_logs(...)),
# which are the modern OO-API module helpers, NOT the old imperative
# chi.lease.create_lease / chi.container.create_container style. There are NO
# imperative python-chi calls and NO raw OpenStack SDK client calls. => purely oo.

summary: >-
  A teaching-on-testbeds CHI@Edge tutorial ("Serving machine learning models on
  edge devices") for the GourmetGram food-classification scenario that benchmarks
  ONNX model inference latency on a Raspberry Pi 5 (Arm Cortex A76) edge device.
  A first notebook uses the object-oriented python-chi API to consume an
  already-created device lease and launch a minimal-notebook Zun container on the
  Pi, copy in three ONNX models, and install onnxruntime; a second notebook, run
  inside that container, times single-sample inference of a baseline model and two
  quantized variants. Lease CREATION is done manually in the Horizon GUI (documented
  in the intro notebook, including a table of the seven nyu-rpi5 device UUIDs), not
  in code.

