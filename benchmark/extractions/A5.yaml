preconditions:
  - "Assumes running inside Chameleon's JupyterHub with python-chi preinstalled; context.choose_project()/choose_site() are interactive dropdown pickers (1_create_edge_container.ipynb)."
  - "Assumes valid Chameleon credentials / app credentials already sourced in the environment."
  - "Assumes a USER environment variable is set (used as a container-name suffix, read via os.getenv('USER'))."
  - >-
    Assumes an ALREADY-EXISTING, currently-ACTIVE edge-device lease named serve_edge_<netID>
    with a device reservation — created MANUALLY in the Horizon GUI per 0_intro.ipynb. The code
    only calls lease.get_lease(...); it never creates the lease or a device reservation.
  - "The container stage assumes the lease exposes l.device_reservations[0]['id']."
  - "Assumes the tutorial is run at the START of the reserved 2-hour lease window (lease status ACTIVE); the intro notebook explicitly separates lease creation (advance) from container launch (at lease start)."
  - "Assumes the reserved hardware is a Raspberry Pi 5 (Arm Cortex A76) at CHI@Edge with internet access to pull quay.io/jupyter/minimal-notebook:latest and to git-clone / pip-install."
  - "workspace/2_measure_pi.ipynb assumes it runs INSIDE the edge container, with models/ (the three .onnx files) present in the working dir and onnxruntime installed (both set up by 1_create_edge_container.ipynb)."
  - "The three ONNX models (food11.onnx, food11_quantized_dynamic.onnx, food11_quantized_aggressive.onnx) are assumed to already exist — they are checked into workspace/models/ (produced by the companion serve-model-chi experiment)."

traps_illustrated:
  - "Container (not server) on CHI@Edge: uses container.Container + c.submit()/c.execute()/c.associate_floating_ip(), never server.Server — the canonical CHI@Edge Zun-container pattern."
  - "Device reservation (not node/flavor reservation) on edge: reservation_id is read from l.device_reservations[0]['id'] (device_reservations, not flavor reservations)."
  - "reservation_id wiring: the edge container pulls reservation_id from the lease object's device_reservations list at index [0]['id']."
  - "Consuming a pre-existing, GUI-created lease: lease.get_lease('serve_edge_netID') instead of creating one in code — lease creation is entirely out-of-band (Horizon)."
  - "Reserving a SPECIFIC edge device by uid: 0_intro documents putting a Pi 5 UUID in the Blazar 'Resource properties' -> uid field (device-pinning), with a table of the seven nyu-rpi5 UUIDs."
  - "Container naming constraint: name is f\"node-serve-edge-{username}\".replace('_', '-') to satisfy the alphanumeric+'-' container-name rule (usernames often contain underscores)."
  - "context.version = \"1.0\" selects the OO python-chi generation — a divergence point vs older imperative chi.lease/chi.server module functions."
  - "exposed_ports on the edge container + c.associate_floating_ip() on a container object (CHI@Edge container port exposure + floating IP) — vs server-side security groups."
  - "Running the workload INSIDE the container via c.execute(...) (git clone / mv / pip install) rather than SSHing into a bare-metal node; then a SECOND notebook runs interactively inside the container's own Jupyter."
  - "Multi-arch/ARM image reality: the edge image quay.io/jupyter/minimal-notebook:latest is a multi-arch upstream image that resolves to arm64 on the Pi 5 — the artifact relies on multi-arch resolution rather than a Chameleon-specific ARM image."
  - "wait_timeout=1200 on c.submit(idempotent=True, ...): edge container bring-up can be slow, so an explicit long timeout is passed (a CHI@Edge-specific gotcha)."
  - "c.execute returns a (stdout, code) tuple (unpacked everywhere) — code is captured but never checked."

not_covered:
  - "No lease CREATION in code — never calls lease.Lease(...) / add_device_reservation(...); the edge lease is created manually in Horizon."
  - "No teardown anywhere — NO c.delete(), l.delete(), or floating-IP release cell; neither notebook cleans up the container or lease."
  - "No lease status/wait polling in code (l.show() only prints); relies on the user timing the run to the lease window. No wait_for_active on the lease."
  - "No error handling / retries / status checks — c.execute return code is ignored; no ERROR-state container handling in code (only a markdown note to delete via Horizon GUI)."
  - "No device_profiles, runtime=, or environment= kwargs on container.Container (unlike GPU/peripheral edge artifacts) — no GPU runtime requested here (CPU-only benchmarking)."
  - "No peripheral/device passthrough (no camera, GPIO, USB, /dev mapping, privileged mode, or host device access)."
  - "No file upload/download via python-chi (no c.upload/c.download); files are moved with in-container shell mv, and the notebook is retrieved by the git clone + browser download, not the API."
  - "No SSH into the edge device/container from the notebook (port 22 is not exposed; only 8888)."
  - "No use of imperative python-chi module functions (chi.lease.create_lease / chi.container.create_container, etc.) and no raw OpenStack SDK clients (nova/neutron/cinder/zun)."
  - "No model TRAINING, quantization, or accuracy evaluation — the three ONNX models are pre-built and only latency/throughput are measured; no real data (random dummy inputs)."
  - "No batch-throughput or multi-sample benchmarking — only single-sample latency (batch size fixed to 1 via fixed_shape=(1, *input_shape[1:])); the intro's batch/GPU targets are context only, not measured here."
  - "No GPU / EPYC / A100 benchmarking in this repo — those are the companion serve-model-chi experiment; this artifact is edge-CPU only."
  - "No networking configuration beyond the single floating IP (no security groups, no reserved networks — intro says 'We won't include any network resources in this lease')."

