preconditions:
  - "Assumes running inside Chameleon's JupyterHub with python-chi preinstalled; context.choose_project()/choose_site() are interactive dropdown pickers."
  - "Assumes valid Chameleon credentials / app credentials already sourced in the environment."
  - "Assumes a USER environment variable is set (used as a resource-name suffix, read via os.getenv('USER'))."
  - "start_edge_llm.ipynb assumes an ALREADY-EXISTING active lease named 'MCPWorld_Edge_1' with a device reservation — the notebook does NOT create the lease; it only calls lease.get_lease(...)."
  - "start_edge_llm.ipynb container stage assumes the lease exposes l.device_reservations[0]['id']."
  - "start_edge_llm.ipynb assumes CHI@Edge hardware with an NVIDIA GPU runtime available (runtime='nvidia') and internet access to pull docker.io/ollama/ollama:latest."
  - "start_edge_llm.ipynb assumes the user fills in model_name (defaults to \"\") before the c.execute ollama-run cell would work."
  - "Assumes an SSH keypair named 'id_rsa' exists in the selected Chameleon project (server notebooks)."
  - "start_run_instance_from_volume.ipynb assumes KVM@TACC (volume/cinder ceph-ssd, sharednet1 network, floating IP pool) and available H100 flavor g1.h100.pci.1; assumes at least one free (unbound) floating IP exists in the project."
  - "start_run_instance_from_volume.ipynb assumes the cinder volume reaches 'available' status before the server create (noted in prose, not enforced in code)."

traps_illustrated:
  - "Container (not server) on CHI@Edge: start_edge_llm.ipynb uses container.Container + c.submit()/c.execute(), never server.Server — contrasts directly with the two server notebooks that use server.Server / nova().servers.create."
  - "Device reservation (not node/flavor reservation) on edge: reservation_id is read from l.device_reservations[0]['id']; the server notebooks instead use add_flavor_reservation + get_reserved_flavors (flavor reservations)."
  - "reservation_id wiring: edge container pulls reservation_id from the lease's device_reservations list index [0]['id']."
  - "Consuming a pre-existing lease: edge notebook uses lease.get_lease('MCPWorld_Edge_1') instead of creating one — a divergence from the create-lease pattern in the server notebooks."
  - "Container naming constraint: comment states the container name 'can only have alphanumeric and -'; name is 'mcpworld-node-serve-edge' (Kubernetes-safe)."
  - "GPU runtime on edge: runtime='nvidia' kwarg on container.Container (edge-specific way to request GPU, vs NVIDIA Container Toolkit install on the server side)."
  - "exposed_ports on the edge container (CHI@Edge container port exposure) = [8888, 11434, 22], and c.associate_floating_ip() on a container — vs server-side security groups + floating IP."
  - "Executing workload via c.execute('ollama run ...') inside the container rather than SSHing into a bare-metal server."
  - "ARM/edge image is NOT used here: the edge image is docker.io/ollama/ollama:latest (multi-arch upstream), not a Chameleon ghcr ARM image — worth flagging as a contrast to typical CHI@Edge ARM examples."
  - "Boot-from-volume trap (server notebook): nova().servers.create with image=\"\" and block_device_mapping_v2 (boot_index 0, source/destination 'volume'), and reserved_flavor.name used as the flavor for a Blazar reservation."

not_covered:
  - "No lease CREATION on CHI@Edge — start_edge_llm.ipynb never calls lease.Lease(...) / add_device_reservation for edge; it assumes 'MCPWorld_Edge_1' already exists."
  - "No teardown in start_edge_llm.ipynb — there is NO c.delete() or l.delete() cell for the edge container/lease (the two server notebooks have commented-out '# s.delete()' / '# l.delete()' cells; the edge notebook has none at all)."
  - "No lease status/wait polling or wait_for_active logic in start_edge_llm.ipynb; no error handling/retries anywhere."
  - "No device_profiles / environment kwargs on the edge container (unlike peripheral artifacts); no device_name/machine_type reservation shown for edge."
  - "No CHI@Edge add_device_reservation call in the repo (the edge lease is external)."
  - "No file upload/download to the edge container, no get_logs; only c.execute stdout is captured."
  - "model_name is left empty ('') — the actual model to run is not specified in the artifact."
  - "No SSH into the edge container is performed in the notebook (port 22 is exposed but not used from the notebook)."
  - "No use of imperative python-chi module functions (chi.lease.create_lease / chi.server.create_server etc.)."
  - "The two server notebooks do not run any experiment payload from Python (post-provision Docker/NVIDIA/MCPWorld setup is documentation-only in markdown, executed manually over SSH)."
  - "No volume attach/detach or persistence demonstration beyond delete_on_termination=False; no snapshot/image creation."
  - "No blazar hardware discovery/query (hardware module imported but unused for discovery); flavor/device names are hardcoded."

