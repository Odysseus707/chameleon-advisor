commit_hash: bc93e84805b32e5e46e9d9c4aa13681f847a2fca
api_generation: oo
# api_generation note: python-chi usage is the object-oriented generation
# (lease.Lease / server.Server / container.Container, context.version="1.0").
# There is NO imperative python-chi (no chi.lease.create_lease-style calls).
# HOWEVER start_run_instance_from_volume.ipynb additionally drops down to the
# raw OpenStack SDK clients (nova(), neutron(), cinder()) and drives them
# imperatively. So at the OpenStack layer the repo is mixed; at the python-chi
# layer it is purely oo. See uncertainties.

summary: >-
  A Chameleon research artifact (the "OpenMCP" resource-provisioning notebooks
  for an MCP/SLM paper) containing three Jupyter notebooks: one CHI@Edge
  notebook that leases an edge device, launches an Ollama container, and runs
  a model, plus two KVM@TACC/CHI notebooks that reserve a flavor and boot a
  server either directly from an image or from a cinder volume. Only
  start_edge_llm.ipynb targets CHI@Edge; it uses the object-oriented python-chi
  API (lease.get_lease + container.Container) and expects a lease named
  "MCPWorld_Edge_1" to already exist. The server notebooks use OO python-chi
  plus, in the volume case, raw nova/neutron/cinder OpenStack clients.

