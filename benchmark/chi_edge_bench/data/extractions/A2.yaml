preconditions:
  - Assumes app credentials / OpenStack auth are already sourced for python-chi (the notebook calls context.choose_site / context.choose_project interactively but does not itself authenticate).
  - Assumes the user has a CHI@Edge project available for context.choose_project().
  - Assumes at least one raspberrypi4-64 device whose device_name starts with "iot-rpi4-picam" is available and unreserved (filter_reserved=True); the code indexes picamera_devs[0] with no empty-list guard.
  - Assumes a physical Pi Camera Module (e.g. Module 3 / imx708) is physically attached to the leased device and the device is configured for the libcamera driver stack.
  - Assumes the prebuilt image ghcr.io/chameleoncloud/edge-picamera-image:latest is pullable and that the "pi_libcamera" device profile exists on CHI@Edge.
  - Assumes the notebook's working directory contains camera_test.py (uploaded via cwd).

traps_illustrated:
  - Device reservation (not node reservation): uses lease.add_device_reservation over hardware devices, not a bare-metal node/compute reservation.
  - Container (not server): workload runs as a chi.container.Container (Kubernetes/edge container), never a Nova server/instance.
  - reservation_id wiring: container reservation_id is pulled from my_lease.device_reservations[0]["id"] — the exact plumbing between lease object and container.
  - device_profiles: requires device_profiles=["pi_libcamera"] to expose /dev camera nodes into the container; central trap of CHI@Edge peripheral access.
  - ARM image: the container/image target is a Raspberry Pi (arm64); Dockerfile base is debian bookworm with raspberrypi apt repo, and machine_type filter is "raspberrypi4-64".
  - Device-name filtering: selecting a peripheral-equipped device by device_name prefix ("iot-rpi4-picam") rather than assuming any node of the type has the camera.
  - Two reservation styles shown: devices=[obj] vs commented device_name='iot-rpi4-picam2',amount=1.
  - exec/upload/download container file-transfer utilities (execute returns (result, code) tuple; download meant for small files only).
  - CMA / dma_heap 64MB limitation caveat affecting capture buffer sizing (README + notebook prose).

not_covered:
  - No GPU/inference, no ML frameworks, no accelerator (Coral/Jetson/GPU) usage.
  - No exposed_ports usage / no network services, no reserved floating IP, no port mapping (exposed_ports=[] is empty).
  - No other peripherals: no GPIO, I2C/SPI sensors, USB devices, microphones, serial, or non-camera hardware.
  - No non-picamera camera paths (USB/UVC webcams, legacy raspistill/raspivid, OpenCV VideoCapture).
  - No imperative python-chi API (chi.lease.create_lease / chi.server) — object API only.
  - No blazarclient direct calls, no python-openstackclient, no Keystone/Glance/Neutron/Nova API usage.
  - No lease renewal/extension, no waiting-for-active polling helper shown explicitly, no error handling / retries.
  - No multi-device or multi-container orchestration, no Kubernetes manifests.
  - No streaming (RTSP/HLS), no live preview, no timelapse, no autofocus/HDR/tuning-file configuration beyond default.
  - No image/video post-processing, no upload to object store / Swift / cloud storage (only container.download).
  - No custom container build/push flow in the notebook (Dockerfile exists but building/pushing to ghcr is not demonstrated in code).
  - No app-credential creation steps shown (auth assumed sourced).

