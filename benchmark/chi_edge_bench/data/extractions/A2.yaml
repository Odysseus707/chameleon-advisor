api_generation: oo   # python-chi object-oriented generation: lease.Lease / container.Container objects, plus chi.context and chi.hardware helpers

summary: >-
  Trovi artifact demonstrating how to use the libcamera / picamera2 camera
  stack on a Raspberry Pi 4 in CHI@Edge. A Jupyter notebook selects the
  CHI@Edge site, discovers a picamera-equipped rpi4 device, leases it, launches
  a prebuilt container with the "pi_libcamera" device profile, and captures a
  still PNG (via rpicam-still and via the picamera2 Python library) and an H264
  video (via rpicam-vid), then tears everything down. It ships a Dockerfile that
  installs libcamera/picamera2/rpicam-apps from the Raspberry Pi apt repo and a
  camera_test.py helper script.

workflow_stages:
  - stage: site/auth
    source_ref: picamera_tutorial.ipynb cell 1 (id ad4bcf2d-b458-4436-95ab-4cd99e6321f0)
    verbatim_code: |
      from chi import context

      context.choose_site(default="CHI@Edge")
      context.choose_project()

  - stage: other   # device discovery / inventory
    source_ref: picamera_tutorial.ipynb cell 3 (id 5d19779e-e688-45e0-90f0-8b336411ec4a)
    verbatim_code: |
      from chi import hardware

      device_type = "raspberrypi4-64"
      available_devices = hardware.get_devices(filter_reserved=True, device_type=device_type)

      picamera_devs = [d for d in available_devices if d.device_name.startswith("iot-rpi4-picam")]
      display([d.device_name for d in picamera_devs])

  - stage: lease
    source_ref: picamera_tutorial.ipynb cell 5 (id 3adb24c1)
    verbatim_code: |
      from chi import lease
      from datetime import timedelta

      my_lease = lease.Lease("rpi4-camera-lease", duration=timedelta(hours=3))

      my_lease.add_device_reservation(devices=[picamera_devs[0]])  # we're just getting a list of 1 device
      # my_lease.add_device_reservation(device_name='iot-rpi4-picam2',amount=1) # or a specific one!
      my_lease.submit(idempotent=True)

  - stage: container
    source_ref: picamera_tutorial.ipynb cell 7 (id 77feeef9-9f69-440e-a1b9-d392d9b5db33)
    verbatim_code: |
      from chi import container

      my_container = container.Container(
          "rpi4-camera-test-01",
          image_ref="ghcr.io/chameleoncloud/edge-picamera-image:latest",
          exposed_ports=[],
          reservation_id=my_lease.device_reservations[0]["id"],
          command=["sleep", "infinity"],
          device_profiles=["pi_libcamera"],
      )
      my_container.submit()

  - stage: exec   # verify camera / list cameras
    source_ref: picamera_tutorial.ipynb cell 9 (id 28aba244)
    verbatim_code: |
      cmd = "rpicam-hello --nopreview --list-cameras"
      result,code = my_container.execute(cmd)
      print(result)

  - stage: exec   # capture still PNG via rpicam-still
    source_ref: picamera_tutorial.ipynb cell 11 (id 28caaf2e-afc2-497a-b1f4-795c6a84b2c7)
    verbatim_code: |
      cmd = "rpicam-still  --nopreview  --output /app/test1.png --width 1920 --height 1080"
      result,code = my_container.execute(cmd)
      print(result)

  - stage: exec   # download still + display
    source_ref: picamera_tutorial.ipynb cell 13 (id f446130b-ab84-4542-9759-6495c6d1e40d)
    verbatim_code: |
      my_container.download("/app/test1.png", ".")
      from IPython.display import Image
      Image("test1.png", height=640,width=480)

  - stage: exec   # upload camera_test.py and run picamera2 script
    source_ref: picamera_tutorial.ipynb cell 15 (id cad98b7f)
    verbatim_code: |
      # Need to get the path for the python script in jupyter
      import os
      cwd = os.getcwd()
      my_container.upload(f"{cwd}/camera_test.py", "/app/")

      # execute it
      result,code = my_container.execute("python3 camera_test.py")
      print(result)

  - stage: exec   # download picamera2 output + display
    source_ref: picamera_tutorial.ipynb cell 16 (id f1ec4c91-a3a8-4d0d-ad51-489488065b42)
    verbatim_code: |
      # copy the output image back
      my_container.download("/app/test2.png", ".")
      from IPython.display import Image
      Image("test2.png", height=640,width=480)

  - stage: exec   # capture H264 video via rpicam-vid
    source_ref: picamera_tutorial.ipynb cell 18 (id bb9c1495-734d-4023-9147-61a65b83b148)
    verbatim_code: |
      cmd = "rpicam-vid --nopreview -t 5000 --output /app/video1.mp4 --width 1920 --height 1080 --framerate 24"
      result,code = my_container.execute(cmd)
      print(result)

  - stage: exec   # download video
    source_ref: picamera_tutorial.ipynb cell 19 (id db003019-2f2d-4ea6-af23-1f7580800c80)
    verbatim_code: |
      # and copy it back
      my_container.download("/app/video1.h264", ".")

  - stage: teardown   # delete container
    source_ref: picamera_tutorial.ipynb cell 21 (id e0d72918)
    verbatim_code: |
      my_container.delete()

  - stage: teardown   # delete lease
    source_ref: picamera_tutorial.ipynb cell 22 (id a3f88ebc)
    verbatim_code: |
      my_lease.delete()

