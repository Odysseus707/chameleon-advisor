uncertainties:
  - The rpicam-vid command writes to /app/video1.mp4 but the subsequent download pulls /app/video1.h264 (mismatched extension); this is verbatim from the artifact, not a transcription error, but whether the file actually exists at download time is a runtime concern I cannot confirm.
  - Cell numbers are the 0-based position of each cell in the notebook's cell array (markdown cells included) as read; I also cite each cell's notebook id for disambiguation. The notebook has no persisted execution_count outputs to cross-check ordering against.
  - api_generation classified as "oo": the artifact mixes object classes (lease.Lease, container.Container) with module-level helper functions (context.choose_site, hardware.get_devices) — both belong to the current python-chi OO generation, so I label it "oo" rather than "mixed", but noting the module-function helpers here for transparency.
  - camera_test.py writes /app/test2.png via capture_file, but the notebook's rpicam-still targets /app/test1.png; there is no test2.png produced by rpicam — it is produced only by the picamera2 script. (Consistent across files; noted for clarity.)

