uncertainties:
  - Notebook "cell numbers" are 0-based positional indices as rendered from the
    .ipynb JSON (cell-0 = first cell); the source .ipynb files contain no
    execution_count / persisted numbering, so cell-N refers to document position.
  - reserve.ipynb cell-2 imports `time` and `server` but neither is used anywhere
    in the repo; recorded as imports only, not as api_calls.
  - cell-31 line `!cd` (bare `cd`) appears to be a no-op / likely intended
    `!cd ~` but is transcribed verbatim as it appears in the artifact.
  - cell-36 path ".image_model/<MODELFILE>" (single leading dot, not "./") is a
    literal template placeholder in the artifact, transcribed verbatim; it is
    likely a typo in the source but is preserved intentionally.
  - "expname" is defined in both reserve.ipynb cell-4 and edge_cpu_inference.ipynb
    cell-12 with the same value "edge-cpu"; the two notebooks are separate.

