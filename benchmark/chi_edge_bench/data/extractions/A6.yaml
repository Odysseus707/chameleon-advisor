preconditions:
  - Running inside the Chameleon JupyterHub / Jupyter environment (relies on
    os.getenv('OS_PROJECT_NAME') and os.getenv('USER') being pre-populated, and
    on a pre-generated SSH keypair at /work/.ssh/id_rsa.pub).
  - App credentials / project auth already sourced by the JupyterHub environment
    (no explicit credential loading, no clouds.yaml, no app-cred cell in the repo).
  - edge_cpu_inference.ipynb assumes an ACTIVE lease for an edge device already
    exists on CHI@Edge (README and cell-8/cell-9 state this explicitly); the user
    must paste the existing lease_id. reserve.ipynb is the companion notebook that
    creates that lease.
  - A CHI@Edge project (format "CHI-XXXXXX") with quota/access to reserve a
    raspberrypi4-64 device.
  - Availability of a raspberrypi4-64 device on CHI@Edge at reservation time.

traps_illustrated:
  - Device reservation (not node/host reservation): uses
    lease.add_device_reservation(res, machine_name=..., count=1), the CHI@Edge
    device-specific reservation call, rather than add_node_reservation.
  - Container (not server/instance): launches workload via
    container.create_container(...) + container.wait_for_active(...), the
    CHI@Edge Zun-container path, not chi.server.Server / bare-metal instances.
  - reservation_id wiring: the container is bound to the lease via
    reservation_id=lease.get_device_reservation(lease_id) — the device
    reservation id must be extracted from the lease, not the lease id itself.
  - ARM64 image requirement: explicitly uses python:3.9-slim and notes only
    ARM64-built images run on CHI@Edge edge devices.
  - platform_version=2 required kwarg on create_container for CHI@Edge.
  - Floating IP lifecycle for containers: associate via
    container.associate_floating_ip, and teardown must separately release it via
    chi.network.get_floating_ip + chi.neutron().delete_floatingip.
  - Machine/profile string: 'raspberrypi4-64' as the device machine_name.
  - Container-name constraint: underscores are not allowed, so
    f"{username}-{expname}".replace("_","-").

not_covered:
  - No GPU / hardware-accelerated inference (Coral TPU, Nvidia Jetson) — CPU-only,
    despite reserve.ipynb mentioning Coral and Nvidia in prose.
  - No add_node_reservation / bare-metal (CHI@TACC, CHI@UC) server workflow.
  - No network creation/management beyond a single floating IP (no
    reserve_floating_ip, no subnet/router/network creation, no security groups).
  - No use of the `server` module despite `from chi import server` being imported
    in reserve.ipynb cell-2 (imported but never called).
  - No object-oriented python-chi API (no lease.Lease(...), no
    container.Container(...), no .submit()/.wait() object methods).
  - No application credential file handling (clouds.yaml, openrc,
    chi.set with app-cred id/secret) — relies entirely on the JupyterHub context.
  - No model training; model is pre-trained and pre-shipped in image_model/.
  - No advanced container options actually used: workdir and command are described
    in prose but never passed; no environment/mounts/device passthrough,
    no GPIO/camera/sensor peripherals.
  - No error handling around the SSH/exec steps or inference beyond the single
    try/except RuntimeError on create_container.
  - No Docker registry auth / private images; no image build step.
  - No snapshot/imaging of the container, no volume/block-storage attachment.

