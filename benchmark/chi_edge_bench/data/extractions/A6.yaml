summary: >
  A CHI@Edge tutorial artifact that reserves a Raspberry Pi 4 edge device via a
  Blazar device reservation, launches a python:3.9-slim ARM64 container against
  that lease, attaches a floating IP and enables SSH, then uploads a quantized
  MobileNet TFLite model and runs CPU-based image-classification inference inside
  the container. It uses the imperative python-chi module-function API
  (chi.lease.* and chi.container.* free functions), not the object-oriented
  lease.Lease / container.Container classes. Leasing lives in reserve.ipynb while
  container launch, inference, and teardown live in edge_cpu_inference.ipynb.

workflow_stages:
  - stage: site/auth
    verbatim_code: |
      import chi, os, time
      from chi import lease
      from chi import server
      from chi import container

      PROJECT_NAME = os.getenv('OS_PROJECT_NAME') # change this if you need to
      chi.use_site("CHI@Edge")
      chi.set("project_name", PROJECT_NAME)
      username = os.getenv('USER') # all exp resources will have this prefix
    source_ref: reserve.ipynb, cell-2

  - stage: site/auth
    verbatim_code: |
      PROJECT_NAME = os.getenv('OS_PROJECT_NAME') #"CHI-XXXXXX" format; Change this if needed
      chi.use_site("CHI@Edge")
      chi.set("project_name", PROJECT_NAME)
    source_ref: edge_cpu_inference.ipynb, cell-7

  - stage: lease
    verbatim_code: |
      NODE_TYPE = 'raspberrypi4-64'
      expname = "edge-cpu"
    source_ref: reserve.ipynb, cell-4

  - stage: lease
    verbatim_code: |
      res = []
      lease.add_device_reservation(res, machine_name=NODE_TYPE, count=1)

      start_date, end_date = lease.lease_duration(days=0, hours=10)
      # if you won't start right now - comment the line above, uncomment two lines below
      # start_date = '2024-04-02 15:24' # manually define to desired start time
      # end_date = '2024-04-03 01:00' # manually define to desired start time

      l = lease.create_lease(f"{username}-{NODE_TYPE}", res, start_date=start_date, end_date=end_date)
      l = lease.wait_for_active(l["id"])  #Comment this line if the lease starts in the future
    source_ref: reserve.ipynb, cell-5

  - stage: lease
    verbatim_code: |
      # continue here, whether using a lease created just now or one created earlier
      l = lease.get_lease(f"{username}-{NODE_TYPE}")
      l['id']
    source_ref: reserve.ipynb, cell-6

  - stage: lease
    verbatim_code: |
      lease_id ="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    source_ref: edge_cpu_inference.ipynb, cell-9

  - stage: container
    verbatim_code: |
      username = os.environ.get("USER")
      expname = "edge-cpu"
      # set a name for the container
      # Note that underscore characters _ are not allowed - we replace each _ with a -
      container_name = f"{username}-{expname}".replace("_","-")
    source_ref: edge_cpu_inference.ipynb, cell-12

  - stage: container
    verbatim_code: |
      try:
          my_container = container.create_container(
              container_name,
              image="python:3.9-slim",
              reservation_id=lease.get_device_reservation(lease_id),
              interactive=True,
              exposed_ports=[22],
              platform_version=2,
          )
      except RuntimeError as ex:
          print(ex)
          print(f"Please stop and/or delete {container_name} and try again")
      else:
          print(f"Successfully created container: {container_name}!")
    source_ref: edge_cpu_inference.ipynb, cell-14

  - stage: container
    verbatim_code: |
      # wait until container is ready to use
      container.wait_for_active(my_container.uuid)
    source_ref: edge_cpu_inference.ipynb, cell-16

  - stage: exec
    verbatim_code: |
      public_ip = container.associate_floating_ip(my_container.uuid)
    source_ref: edge_cpu_inference.ipynb, cell-20

  - stage: exec
    verbatim_code: |
      container.execute(my_container.uuid, 'apt update')
      container.execute(my_container.uuid, 'apt -y install openssh-server')
    source_ref: edge_cpu_inference.ipynb, cell-22

  - stage: exec
    verbatim_code: |
      !mkdir -p tmp_keys
      !cp /work/.ssh/id_rsa.pub tmp_keys/authorized_keys
    source_ref: edge_cpu_inference.ipynb, cell-24

  - stage: exec
    verbatim_code: |
      container.execute(my_container.uuid, 'mkdir -p /root/.ssh')
      container.upload(my_container.uuid, "./tmp_keys/authorized_keys", "/root/.ssh")
      container.execute(my_container.uuid, 'chown root /root/.ssh')
      container.execute(my_container.uuid, 'chown root /root/.ssh/authorized_keys')
      container.execute(my_container.uuid, 'chmod go-w /root')
      container.execute(my_container.uuid, 'chmod 700 /root/.ssh')
      container.execute(my_container.uuid, 'chmod 600 /root/.ssh/authorized_keys')
    source_ref: edge_cpu_inference.ipynb, cell-25

  - stage: exec
    verbatim_code: |
      container.execute(my_container.uuid, 'service ssh start')
      container.execute(my_container.uuid, 'service ssh status')
    source_ref: edge_cpu_inference.ipynb, cell-27

  - stage: exec
    verbatim_code: |
      print("ssh root@%s" % public_ip)
    source_ref: edge_cpu_inference.ipynb, cell-29

  - stage: exec
    verbatim_code: |
      !git clone https://github.com/teaching-on-testbeds/edge-cpu-inference.git
      !cd
      !cp -R ./edge-cpu-inference/image_model ./
      !rm -f -R edge-cpu-inference
    source_ref: edge_cpu_inference.ipynb, cell-31

  - stage: exec
    verbatim_code: |
      container.upload(my_container.uuid, "./image_model", "/root/")
      container.execute(my_container.uuid, "ls -h /root/image_model/") #Check if all the files under the image_model directory have been uploaded
    source_ref: edge_cpu_inference.ipynb, cell-33

  - stage: exec
    verbatim_code: |
      container.upload(my_container.uuid, ".image_model/<MODELFILE>", "/root/image_model/") #Replace MODELFILE with the name of your model file
    source_ref: edge_cpu_inference.ipynb, cell-36

  - stage: exec
    verbatim_code: |
      container.execute(my_container.uuid, 'pip install tflite-runtime Pillow')
    source_ref: edge_cpu_inference.ipynb, cell-39

  - stage: exec
    verbatim_code: |
      from IPython.display import Image
      Image('image_model/parrot.jpg')
    source_ref: edge_cpu_inference.ipynb, cell-41

  - stage: exec
    verbatim_code: |
      result = container.execute(my_container.uuid, 'python /root/image_model/model.py --model mobilenet_v2_1.0_224_quantized_1_default_1.tflite --label imagenet_labels.txt --image parrot.jpg ')
      print(result['output'])
    source_ref: edge_cpu_inference.ipynb, cell-43

  - stage: teardown
    verbatim_code: |
      container.destroy_container(my_container.uuid)
    source_ref: edge_cpu_inference.ipynb, cell-46

  - stage: teardown
    verbatim_code: |
      ip_details = chi.network.get_floating_ip(public_ip)
      chi.neutron().delete_floatingip(ip_details["id"])
    source_ref: edge_cpu_inference.ipynb, cell-48

  - stage: teardown
    verbatim_code: |
      # setup environment - if you made any changes in the top part, make the same changes here
      import chi, os
      from chi import lease

      PROJECT_NAME = os.getenv('OS_PROJECT_NAME') # change this if you need to
      chi.use_site("CHI@Edge")
      chi.set("project_name", PROJECT_NAME)
      username = os.getenv('USER')

      lease = chi.lease.get_lease(f"{username}-{NODE_TYPE}")
    source_ref: reserve.ipynb, cell-8

  - stage: teardown
    verbatim_code: |
      DELETE = False #Default value is False to prevent any accidental deletes. Change it to True for deleting the resources

      if DELETE:

          # delete lease
          chi.lease.delete_lease(lease["id"])
    source_ref: reserve.ipynb, cell-9

