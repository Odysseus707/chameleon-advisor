api_generation: imperative

summary: >
  A CHI@Edge Trovi artifact that builds an Ubuntu 22.04 Docker image with an
  SSH-enabled sshd config (packaged via Dockerfile + GitHub Actions arm64 build)
  and a tutorial notebook that reserves a raspberrypi4-64 edge device, launches
  the SSH container, uploads the user's public key, and associates a floating IP
  so the user can SSH in as root. All python-chi calls use the imperative
  module-function API (chi.*, chi.lease.*, chi.container.*); create_container
  returns an object whose .uuid attribute is used in later calls.

workflow_stages:
  - stage: site/auth
    verbatim_code: |
      import chi
      # Before we go any further, we need to select which Chameleon site we will be using.
      chi.use_site("CHI@Edge")
    source_ref: SSH_on_chiedge_tutorial.ipynb cell 1
  - stage: site/auth
    verbatim_code: |
      chi.set("project_name", "Chameleon")
    source_ref: SSH_on_chiedge_tutorial.ipynb cell 2
  - stage: other
    verbatim_code: |
      from chi import container
      from chi import lease
    source_ref: SSH_on_chiedge_tutorial.ipynb cell 3
  - stage: lease
    verbatim_code: |
      # machine name refers to the "type" of device
      machine_name = "raspberrypi4-64"

      # get dates for lease start and end
      start, end = lease.lease_duration(days=1)

      # make a unique name for the lease
      lease_name = f"ssh-{machine_name}-{start}"

      reservations = []
      lease.add_device_reservation(reservations, count=2, machine_name=machine_name)
      container_lease = lease.create_lease(lease_name, reservations)
      lease_id = container_lease["id"]

      print(f"created lease with name {lease_name} and uuid {lease_id}, waiting for it to start. This can take up to 60s.")
      lease.wait_for_active(lease_id)
      print("Done!")
    source_ref: SSH_on_chiedge_tutorial.ipynb cell 5
  - stage: container
    verbatim_code: |
      print("Requesting container ... This may take a while as the large container image is being downloaded")

      # Set a name for the container. Because CHI@Edge uses Kubernetes, ensure that underscores aren't in the name
      container_name = f"tutorial-{machine_name}-ssh".replace("_","-")

      try:
          my_container = container.create_container(
              container_name,
              image="ghcr.io/chameleoncloud/edge_ssh_image:latest",
              workdir="/home",
              exposed_ports=[22],
              reservation_id=lease.get_device_reservation(lease_id),
              platform_version=2,
          )
      except RuntimeError as ex:
          print(ex)
          print(f"please stop and/or delete {container_name} and try again")
      else:
          print(f"Successfully created container: {container_name}!")
    source_ref: SSH_on_chiedge_tutorial.ipynb cell 7
  - stage: exec
    verbatim_code: |
      chi.container.upload(my_container.uuid, "./edge_user_public_key", "/root/.ssh/")
    source_ref: SSH_on_chiedge_tutorial.ipynb cell 9
  - stage: exec
    verbatim_code: |
      cmd = "/bin/bash -c \"chmod 600 /root/.ssh/authorized_keys\""
      chi.container.execute(my_container.uuid, cmd)
    source_ref: SSH_on_chiedge_tutorial.ipynb cell 10
  - stage: exec
    verbatim_code: |
      cmd = "/bin/bash -c \"cat /root/.ssh/edge_user_public_key >> /root/.ssh/authorized_keys\""
      chi.container.execute(my_container.uuid, cmd)
    source_ref: SSH_on_chiedge_tutorial.ipynb cell 11
  - stage: exec
    verbatim_code: |
      ip_address = chi.container.associate_floating_ip(my_container.uuid)

      print("use the following command to ssh into the container: ssh root@" + ip_address)
    source_ref: SSH_on_chiedge_tutorial.ipynb cell 13
  - stage: teardown
    verbatim_code: |
      chi.container.destroy_container(my_container.uuid)
    source_ref: SSH_on_chiedge_tutorial.ipynb cell 15

