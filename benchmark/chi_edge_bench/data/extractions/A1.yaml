preconditions:
  - Assumes python-chi (the `chi` package) is installed and importable in the notebook kernel.
  - Assumes valid Chameleon credentials / app credentials are already sourced in the
    environment (the notebook only calls chi.use_site and chi.set project_name; it does
    not perform explicit authentication).
  - Assumes the user belongs to a project named "Chameleon" (hardcoded via chi.set).
  - Assumes CHI@Edge has available raspberrypi4-64 devices to satisfy count=2.
  - Assumes the prebuilt image ghcr.io/chameleoncloud/edge_ssh_image:latest exists and is arm64.
  - Assumes the user has edited the local edge_user_public_key file to contain their real RSA
    public key before running the upload cell.
  - Cells run in order: exec/upload/floating-ip cells assume the lease is active and the
    container (my_container) was successfully created.

traps_illustrated:
  - Device reservation (lease.add_device_reservation with machine_name) rather than node
    reservation — CHI@Edge reserves edge *devices*, not bare-metal nodes.
  - Container workflow (container.create_container) rather than a bare-metal server/instance.
  - ARM64 image target — the image is built for linux/arm64 for the raspberrypi4-64 device.
  - device_profile / machine_type string "raspberrypi4-64" is the CHI@Edge device type name.
  - reservation_id wiring — reservation_id is populated by lease.get_device_reservation(lease_id),
    NOT the raw lease_id, and is passed into create_container.
  - Kubernetes naming constraint — container_name must not contain underscores
    (.replace("_","-")).
  - platform_version=2 required kwarg for CHI@Edge container creation.
  - Floating IP association is a separate explicit step (associate_floating_ip) after container start.

not_covered:
  - No explicit authentication / app-credential sourcing code (assumes environment already set).
  - No lease deletion / teardown (only the container is destroyed; the lease is left active).
  - No node/bare-metal (chi.server / hardware) reservation or instance launch.
  - No network, subnet, router, or security-group configuration APIs.
  - No blazarclient direct usage — leasing goes only through chi.lease wrappers.
  - No image building/registration from within the notebook (image is prebuilt via GitHub Actions).
  - No use of container.get_container, list, logs, snapshot, or wait_for_active on the container.
  - No error handling beyond a single try/except RuntimeError around create_container.
  - No GPU, FPGA, sensor, camera, serial, or other peripheral device usage.
  - No object storage (Swift), Gnocchi metrics, or Keystone/openstack SDK calls.
  - No multi-device orchestration despite count=2 (only one container is created/used).
  - No detach/removal of floating IP; no chi.container.destroy of the reservation.

memorization_probes:
  - "cat /root/.ssh/edge_user_public_key >> /root/.ssh/authorized_keys"
  - 'container_name = f"tutorial-{machine_name}-ssh".replace("_","-")'
  - "if ssh'ing into the device hangs forever when connecting to device part, please release the floating IP via the chi@edge openstack dashboard and rerun the cell below"

uncertainties:
  - api_generation classified as "imperative": all calls are module-level functions
    (chi.*, chi.lease.*, chi.container.*). However create_container returns an object
    and later calls read `my_container.uuid`, a mildly OO-flavored return value. Not
    "oo" in the lease.Lease/container.Container sense, so recorded as imperative.
  - Module paths: `lease` and `container` are bound via `from chi import container`
    and `from chi import lease`; calls appear both as bare `lease.`/`container.` and as
    `chi.container.` (e.g. chi.container.upload). I recorded the fully-qualified chi.lease
    / chi.container module for clarity; the source uses the shorter aliases for lease/create
    calls and `chi.container.` for upload/execute/associate_floating_ip/destroy.
  - The `end` variable from lease.lease_duration(days=1) is unpacked but never used.
  - count=2 reserves two devices but only a single container is ever created; unclear
    whether the extra device is intentional.
  - edge_user_public_key on disk contains the placeholder text
    "replace this line with your RSA public key" (not a real key).

