id: AV04
version: '4.0'
lineage: new
category: Availability
axis: READ
prompt: Print the device_name of every currently-free CHI@Edge device that supports the pi_sensehat device
  profile.
designed_trap: supported_device_profiles is not documented in the tutorials; guessing device names instead
  of filtering by profile.
trap_tags:
- live_state
target_artifact:
- A2
fed_sets:
  blind: []
  matched:
  - A2
  - A3
tier_intent_by_condition:
  matched: T4
key_tokens:
  mechanism:
  - get_devices
  - filter_reserved
  specifics:
  - supported_device_profiles
api_anchor: python-chi OO generation (D01)
verification_level: V1
expected_answer_type: code
v1_expect:
  stdout_contains_all:
  - iot-rpi4-picam3
  stdout_not_contains:
  - iot-rpi4-picam2
  - iot-rpi-cm4-02
gold_spec: |
  from chi import hardware

  devs = hardware.get_devices(filter_reserved=True)
  for d in devs:
      if "pi_sensehat" in d.supported_device_profiles:
          print(d.device_name)
gold_provenance: get_devices pattern from A2; Device fields from the advisor prototype probe
checkers:
- check: availability_query
  group: mechanism
- check: required_code_string
  group: specifics
  s: supported_device_profiles
