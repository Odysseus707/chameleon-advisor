id: N10
version: '4.0'
lineage: new
category: Composition
axis: ACT
prompt: The device iot-rpi4-picam3 has both a camera module and a Sense HAT attached. Reserve it and launch
  ONE container that can access both peripherals; then verify each (list cameras; probe the sensor bus).
designed_trap: device_profiles is a list and can carry both profiles; models tend to pick one profile
  or launch two containers.
trap_tags:
- composition
- magic_profile
target_artifact:
- A2
- A3
fed_sets:
  blind: []
  matched:
  - A2
  - A3
tier_intent_by_condition:
  matched: T3
key_tokens:
  mechanism:
  - device_profiles
  specifics:
  - pi_libcamera
  - pi_sensehat
  - iot-rpi4-picam3
api_anchor: python-chi OO generation (D01)
verification_level: V0
expected_answer_type: code
gold_spec: |
  from chi import lease, container
  from datetime import timedelta

  my_lease = lease.Lease("dual-periph-lease", duration=timedelta(hours=4))
  my_lease.add_device_reservation(
      amount=1, machine_type="raspberrypi4-64", device_name="iot-rpi4-picam3"
  )
  my_lease.submit(idempotent=True)

  my_container = container.Container(
      "dual-periph-run",
      image_ref="ghcr.io/chameleoncloud/edge-picamera-image:latest",
      exposed_ports=[],
      reservation_id=my_lease.device_reservations[0]["id"],
      command=["sleep", "infinity"],
      device_profiles=["pi_libcamera", "pi_sensehat"],
  )
  my_container.submit()

  result, code = my_container.execute("rpicam-hello --nopreview --list-cameras")
  print(result)
  result, code = my_container.execute("i2cdetect -y 1")
  print(result)
gold_provenance: authored from artifact(s) ['A2', 'A3']
