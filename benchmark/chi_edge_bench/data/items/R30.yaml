gold_spec: '1. raspberrypi4-64 - 36 of 36 free; CPU only; 8 GB.

  2. raspberrypi5 - 10 of 10 free; CPU only; 8 GB.

  3. jetson-xavier-nx-devkit-emmc - 4 of 4 free; CUDA 7.2, 384 cores; 8 GB.


  Configuration (artifact A5): image quay.io/jupyter/minimal-notebook:latest. NOTE: A5 validated
  this on raspberrypi5, not on raspberrypi4-64. Both are arm64, so the image is compatible
  in principle, but no artifact demonstrates it on raspberrypi4-64.


  Also feasible, lower ranked: jetson-orin-nano-devkit-nvme, jetson-agx-orin-devkit-64gb.


  Not recommended:

  - coral-dev: 1 GB < 8 GB.

  - jetson-nano: no int8 support.

  '
