id: N13
version: '4.0'
lineage: new
category: API translation
axis: ACT
prompt: Our lab standardized on the classic imperative python-chi API. Using ONLY that style (module functions
  - no Lease/Container classes), reserve one Pi 4 for 10 hours starting now and launch python:3.9-slim
  on it with SSH installed and reachable from outside.
designed_trap: platform_version=2 is mandatory on create_container; OO habits leak in.
