gold_spec: '1. raspberrypi4-64 - 22 of 36 free; CPU only; 8 GB.

  2. raspberrypi5 - 1 of 10 free; CPU only; 8 GB.


  Configuration (artifact A5): image quay.io/jupyter/minimal-notebook:latest. NOTE: A5 validated
  this on raspberrypi5, not on raspberrypi4-64. Both are arm64, so the image is compatible
  in principle, but no artifact demonstrates it on raspberrypi4-64.


  Not recommended:

  - coral-dev: 1 GB < 8 GB.

  - jetson-agx-orin-devkit-64gb: 0 of 1 free, need 1.

  - jetson-nano: 4 GB < 8 GB.

  - jetson-orin-nano-devkit-nvme: 0 of 3 free, need 1.

  - jetson-xavier-nx-devkit-emmc: 0 of 4 free, need 1.

  '
