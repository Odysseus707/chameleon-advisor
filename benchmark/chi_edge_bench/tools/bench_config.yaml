# run_bench.py configuration — models and params are pinned HERE, not in code.
# Node paths refer to the Chameleon P100 node (integration-testbed).

# RETIRED 2026-08-21: the P100 node is permanently gone (SSH times out). Kept as
# the record of where s1-s5 were collected. Nothing in run_bench.py reads this
# block; only node_sync.sh did, via BENCH_NODE.
# node:
#   host: cc@129.114.108.156
#   key: vivek.pem  # at the chameleon-work repo root

fork:
  # Local paths since the node died. expanduser is applied (run_bench.py:137) but
  # not resolution against the repo, so "~"-prefixed beats a bare relative path,
  # which would depend on the caller's cwd.
  root: "~/Desktop/Chameleon Fellowship/chameleon-work/RAG-docs-chameleon"
  advisor_root: "~/Desktop/Chameleon Fellowship/chameleon-work/chi-edge-advisor"
  advisor_grounding: "~/Desktop/Chameleon Fellowship/chameleon-work/grounding"
  gate: 1.0
  # ACTIVE CONFIG. Tejas serving Meta-Llama-3.3-70B-Instruct is what the system
  # runs on, so it is what an unconfigured fork run gets. Applied with setdefault
  # (run_bench.py:133), so exported env still wins.
  #
  # No API key here: rag.py:16 reads LLM_API_KEY or TEJAS_API_KEY from the
  # environment, and a missing key belongs in a loud 401, not in a config file.
  env:
    LLM_API_BASE: https://ai.tejas.tacc.utexas.edu/v1
    LLM_MODEL: Meta-Llama-3.3-70B-Instruct
    LLM_PROVIDER: tejas
    TEJAS_BASE_URL: https://ai.tejas.tacc.utexas.edu/v1
    TEJAS_MODEL: Meta-Llama-3.3-70B-Instruct
    ADVISOR_OFFLINE: "false"

  # RECORD ONLY - nothing reads this key. ForkAdapter.prepare iterates fork.env
  # and nothing else (run_bench.py:133), so these values cannot reach a run.
  #
  # What s3-chatbot-noadv and s4-chatbot-adv actually executed against: the
  # Chameleon P100 node's local Ollama. Retained because deleting it would
  # destroy the provenance of results we still cite. It used to sit in fork.env
  # itself, which made one block both the historical record and the live
  # default - so an unconfigured run silently targeted a dead endpoint.
  provenance_s3_s4:
    collected: 2026-08-14 .. 2026-08-17
    LLM_API_BASE: http://localhost:11434/v1
    LLM_MODEL: qwen2.5:32b-instruct-q4_K_M
    TEJAS_BASE_URL: http://localhost:11434/v1
    TEJAS_MODEL: qwen2.5:32b-instruct-q4_K_M
    GROUNDING_DIR: /home/cc/grounding

# The zero-spend policy that kept these adapters dry-run-only was lifted on
# 2026-08-24 for the Claude arm of the artifacts A/B. Keys still come from the
# environment only, never from this file.
anthropic:
  # One system across both conditions, matching every other arm: the 2x2 is
  # (system x condition), so putting the condition in the system name would
  # stop score_runs pairing blind against matched.
  #
  # Supersedes s5-claude-sonnet, which was hand-pasted and is the only arm with
  # no prompt binding. That arm stays on disk as the historical record.
  system: s12-claude-sonnet-api
  model: claude-sonnet-5
  params:
    max_tokens: 2048
    temperature: 0.0

openai:
  system: s2-gpt
  model: gpt-4o # placeholder — set to the exact model used for s2-gpt before any real run
  params:
    max_tokens: 2048
    temperature: 0.0

pilot:
  # setup / OO-API / multi-device ACT / edge ACT / V1 snapshot-exec spread
  items: [P01, P16, N01, N06, AV01]
