id: N14
version: '4.0'
lineage: new
category: Uncovered peripheral
axis: REASON
prompt: I want to record audio from a USB microphone plugged into a CHI@Edge Raspberry Pi. Which device
  profile do I use and how do I set up the container?
designed_trap: No audio profile is documented anywhere; the correct behavior is discovery or honest abstention,
  not a fabricated profile string.
trap_tags:
- abstention
- magic_profile
target_artifact: []
fed_sets:
  blind: []
  uncovered:
  - A1
  - A2
  - A3
tier_intent_by_condition:
  uncovered: T4
key_tokens:
  mechanism:
  - get_devices
  specifics:
  - microphone
api_anchor: python-chi OO generation (D01)
verification_level: V0
expected_answer_type: abstain_or_discover
gold_spec: |
  from chi import hardware

  # No public CHI@Edge artifact documents a microphone/audio device profile, and I
  # cannot verify that one exists. The correct move is to inspect live inventory
  # for the profiles devices actually support instead of guessing a profile string:
  devs = hardware.get_devices(filter_reserved=True, device_type="raspberrypi4-64")
  for d in devs:
      print(d.device_name, d.supported_device_profiles)
  # If no audio-related profile appears, this workload is not currently supported
  # via device_profiles; ask the Chameleon help desk before proceeding.
gold_provenance: authored from artifact(s) none (uncovered)
