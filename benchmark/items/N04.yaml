id: N04
version: '4.0'
lineage: new
category: Peripherals · GPIO
axis: VALIDATE
prompt: The Waveshare Sense HAT (B) is attached to iot-rpi-cm4-02. Reserve that device and launch the
  sensor container configured so the GPIO libraries work despite the missing devicetree info inside containers;
  then list what's on the I2C bus.
designed_trap: Choosing pi_sensehat because 'Sense HAT' is in the name (the Waveshare variant needs pi_gpio
  + three env-var workarounds).
trap_tags:
- magic_profile
- env_workaround
