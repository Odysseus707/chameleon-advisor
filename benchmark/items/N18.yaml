id: N18
version: '4.0'
lineage: new
category: Uncovered peripheral
axis: REASON
prompt: Use a plain USB (UVC) webcam on a CHI@Edge Pi with OpenCV - what device profile and container
  setup do I need?
designed_trap: pi_libcamera covers the CSI camera stack, not UVC; no UVC profile is documented - fabricating
  one is the failure mode.
trap_tags:
- abstention
- magic_profile
target_artifact: []
fed_sets:
