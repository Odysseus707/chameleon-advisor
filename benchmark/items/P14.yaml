id: P14
version: '4.0'
lineage: v3:P14
category: SSH / Dev
axis: REASON
prompt: 'End-to-end: get me a Pi on CHI@Edge I can hit with VS Code Remote-SSH.'
designed_trap: Drops a link in reserve->image->key->FIP chain.
trap_tags:
- bare_metal_api
- magic_image
- key_injection
- floating_ip
target_artifact:
- A1
fed_sets:
  blind: []
  matched:
  - A1
tier_intent_by_condition:
  matched: T1
key_tokens:
  mechanism:
  - add_device_reservation
  - reservation_id
  - associate_floating_ip
  - upload
  specifics:
  - ghcr.io/chameleoncloud/edge_ssh_image
  - raspberrypi4-64
  - authorized_keys
api_anchor: python-chi OO generation (D01); imperative accepted at full credit iff trap-free
verification_level: V0
expected_answer_type: code
gold_spec: |
  from chi import context, lease, container
  from datetime import timedelta

  context.choose_site(default="CHI@Edge")
  context.choose_project()

  my_lease = lease.Lease("vscode-pi-lease", duration=timedelta(hours=4))
  my_lease.add_device_reservation(amount=1, machine_type="raspberrypi4-64")
  my_lease.submit(idempotent=True)

  my_container = container.Container(
      "vscode-ssh-target",
      image_ref="ghcr.io/chameleoncloud/edge_ssh_image:latest",
      exposed_ports=[22],
      reservation_id=my_lease.device_reservations[0]["id"],
  )
  my_container.submit()

  my_container.upload("./edge_user_public_key", "/root/.ssh/")
  my_container.execute('/bin/bash -c "chmod 600 /root/.ssh/authorized_keys"')
  my_container.execute('/bin/bash -c "cat /root/.ssh/edge_user_public_key >> /root/.ssh/authorized_keys"')

  ip = my_container.associate_floating_ip()
  print(f"Point VS Code Remote-SSH at root@{ip}")
gold_provenance: 'authored from artifact(s) [''A1''] extractions; v3 gold: reserve Pi -> Container(edge_ssh_image,
  exposed_ports=[22]) -> upload+authorize key -> associate_floating_ip -> VS Code to root@ip'
